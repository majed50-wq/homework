<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML to File Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 10px; height: 10px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #181825; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #313244; border-radius: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #45475a; }
        body { margin: 0; background-color: #0f172a; color: #cbd5e1; }
        .hidden-view { opacity: 0; pointer-events: none; z-index: 0; }
        .active-view { opacity: 1; pointer-events: auto; z-index: 10; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center justify-center font-sans">
    
    <div class="w-full max-w-5xl">
        <div class="mb-6 flex flex-col sm:flex-row items-center justify-between">
            <div class="flex items-center space-x-3 mb-4 sm:mb-0">
                <div class="p-3 bg-blue-500/20 text-blue-400 rounded-xl flex items-center justify-center">
                    <i data-lucide="file-code-2" class="w-8 h-8"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-white tracking-tight">HTML to File</h1>
                    <p class="text-sm text-slate-400">Convert code into a downloadable document</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3 bg-slate-800 p-2 rounded-xl border border-slate-700 w-full sm:w-auto">
                <span class="text-sm font-medium text-slate-400 pl-2">Save as:</span>
                <div class="flex bg-slate-900 rounded-lg border border-slate-700 overflow-hidden focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500">
                    <input type="text" id="filenameInput" value="index" placeholder="index" class="bg-transparent border-none outline-none text-white text-sm px-3 py-2 w-32 sm:w-40" />
                    <span class="bg-slate-800 text-slate-400 px-3 py-2 text-sm border-l border-slate-700 font-mono">.html</span>
                </div>
                <button id="downloadBtn" class="flex items-center px-4 py-2 rounded-lg font-medium text-sm transition-all shadow-lg bg-blue-600 text-white hover:bg-blue-500 hover:shadow-blue-500/25">
                    <i data-lucide="download" class="w-4 h-4 mr-2"></i> Download
                </button>
            </div>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl flex flex-col h-[70vh]">
            <div class="flex items-center justify-between bg-slate-900/50 border-b border-slate-700 px-2">
                <div class="flex">
                    <button id="tabEditor" class="flex items-center px-6 py-4 text-sm font-medium border-b-2 transition-colors border-blue-500 text-blue-400 bg-slate-800/50">
                        <i data-lucide="code-2" class="w-4 h-4 mr-2"></i> Source Code
                    </button>
                    <button id="tabPreview" class="flex items-center px-6 py-4 text-sm font-medium border-b-2 transition-colors border-transparent text-slate-400 hover:text-slate-300 hover:bg-slate-800/30">
                        <i data-lucide="play" class="w-4 h-4 mr-2"></i> Live Preview
                    </button>
                </div>
                
                <div id="editorToolbar" class="flex items-center space-x-2 pr-2">
                    <button id="clearBtn" class="p-2 text-slate-500 hover:text-red-400 hover:bg-red-400/10 rounded-lg transition-colors" title="Clear Editor">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    </button>
                    <button id="copyBtn" class="flex items-center px-3 py-1.5 text-xs font-medium rounded-lg transition-colors bg-slate-700 text-slate-300 hover:bg-slate-600">
                        <i data-lucide="copy" id="copyIcon" class="w-3.5 h-3.5 mr-1.5"></i> <span id="copyText">Copy</span>
                    </button>
                </div>
                
                <div id="previewToolbar" class="pr-4 text-xs text-slate-500 hidden items-center">
                    <i data-lucide="alert-circle" class="w-3.5 h-3.5 mr-1.5"></i> Preview updates automatically
                </div>
            </div>

            <div class="flex-1 relative overflow-hidden bg-[#1e1e2e]">
                <div id="viewEditor" class="absolute inset-0 transition-opacity duration-200 active-view">
                    <textarea id="codeArea" spellcheck="false" placeholder="Paste your HTML code here..." class="w-full h-full bg-transparent text-slate-300 font-mono text-sm p-6 outline-none resize-none custom-scrollbar" style="tab-size: 4; line-height: 1.6;"></textarea>
                </div>
                <div id="viewPreview" class="absolute inset-0 bg-white transition-opacity duration-200 hidden-view">
                    <iframe id="previewFrame" title="HTML Preview" class="w-full h-full border-0"></iframe>
                </div>
            </div>
        </div>
        <p class="text-center text-xs text-slate-500 mt-6">Everything processes locally. No data is sent to a server.</p>
    </div>

    <script>
        lucide.createIcons();
        const defaultHTML = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Generated Page</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: white; }
        .container { text-align: center; background: rgba(0, 0, 0, 0.2); padding: 3rem; border-radius: 1rem; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); }
        h1 { margin-top: 0; }
        button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 5px; background: white; color: #ff8c00; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello, World! 🌍</h1>
        <p>This is a complete HTML file ready for download.</p>
        <button onclick="alert('JavaScript is working!')">Click Me</button>
    </div>
</body>
</html>`;

        const codeArea = document.getElementById('codeArea');
        const previewFrame = document.getElementById('previewFrame');
        const filenameInput = document.getElementById('filenameInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const tabEditor = document.getElementById('tabEditor');
        const tabPreview = document.getElementById('tabPreview');
        const viewEditor = document.getElementById('viewEditor');
        const viewPreview = document.getElementById('viewPreview');
        const editorToolbar = document.getElementById('editorToolbar');
        const previewToolbar = document.getElementById('previewToolbar');

        codeArea.value = defaultHTML;

        function updatePreview() {
            const html = codeArea.value;
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            doc.open(); doc.write(html); doc.close();
        }

        function toggleDownloadButton() {
            if (codeArea.value.trim() === '') {
                downloadBtn.classList.add('bg-slate-700', 'text-slate-500', 'cursor-not-allowed');
                downloadBtn.classList.remove('bg-blue-600', 'text-white', 'hover:bg-blue-500', 'hover:shadow-blue-500/25');
            } else {
                downloadBtn.classList.remove('bg-slate-700', 'text-slate-500', 'cursor-not-allowed');
                downloadBtn.classList.add('bg-blue-600', 'text-white', 'hover:bg-blue-500', 'hover:shadow-blue-500/25');
            }
        }

        codeArea.addEventListener('input', toggleDownloadButton);
        filenameInput.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/[^a-zA-Z0-9_-]/g, ''); });

        tabEditor.addEventListener('click', () => {
            tabEditor.classList.add('border-blue-500', 'text-blue-400', 'bg-slate-800/50');
            tabEditor.classList.remove('border-transparent', 'text-slate-400', 'hover:text-slate-300', 'hover:bg-slate-800/30');
            tabPreview.classList.remove('border-emerald-500', 'text-emerald-400', 'bg-slate-800/50');
            tabPreview.classList.add('border-transparent', 'text-slate-400', 'hover:text-slate-300', 'hover:bg-slate-800/30');
            viewEditor.classList.replace('hidden-view', 'active-view');
            viewPreview.classList.replace('active-view', 'hidden-view');
            editorToolbar.classList.remove('hidden'); editorToolbar.classList.add('flex');
            previewToolbar.classList.add('hidden'); previewToolbar.classList.remove('flex');
        });

        tabPreview.addEventListener('click', () => {
            updatePreview();
            tabPreview.classList.add('border-emerald-500', 'text-emerald-400', 'bg-slate-800/50');
            tabPreview.classList.remove('border-transparent', 'text-slate-400', 'hover:text-slate-300', 'hover:bg-slate-800/30');
            tabEditor.classList.remove('border-blue-500', 'text-blue-400', 'bg-slate-800/50');
            tabEditor.classList.add('border-transparent', 'text-slate-400', 'hover:text-slate-300', 'hover:bg-slate-800/30');
            viewPreview.classList.replace('hidden-view', 'active-view');
            viewEditor.classList.replace('active-view', 'hidden-view');
            previewToolbar.classList.remove('hidden'); previewToolbar.classList.add('flex');
            editorToolbar.classList.add('hidden'); editorToolbar.classList.remove('flex');
        });

        downloadBtn.addEventListener('click', () => {
            const htmlCode = codeArea.value;
            if (!htmlCode.trim()) return;
            const blob = new Blob([htmlCode], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            let finalName = filenameInput.value.trim();
            if (!finalName) finalName = 'index';
            if (!finalName.toLowerCase().endsWith('.html')) finalName += '.html';
            link.download = finalName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(codeArea.value);
            const copyIcon = document.getElementById('copyIcon');
            const copyText = document.getElementById('copyText');
            copyBtn.classList.add('bg-emerald-500/20', 'text-emerald-400');
            copyBtn.classList.remove('bg-slate-700', 'text-slate-300');
            copyIcon.setAttribute('data-lucide', 'check-circle-2');
            copyText.textContent = 'Copied!';
            lucide.createIcons();
            setTimeout(() => {
                copyBtn.classList.remove('bg-emerald-500/20', 'text-emerald-400');
                copyBtn.classList.add('bg-slate-700', 'text-slate-300');
                copyIcon.setAttribute('data-lucide', 'copy');
                copyText.textContent = 'Copy';
                lucide.createIcons();
            }, 2000);
        });

        clearBtn.addEventListener('click', () => {
            if (window.confirm('Are you sure you want to clear the editor?')) {
                codeArea.value = '';
                toggleDownloadButton();
            }
        });
    </script>
</body>
</html>
