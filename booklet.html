```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabic RTL Booklet Maker</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM (No crossorigin tags to ensure file:// compatibility) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel for parsing JSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.3/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .rtl { direction: rtl; font-family: system-ui, -apple-system, sans-serif; }
        .ltr { direction: ltr; }
        body { margin: 0; background-color: #f9fafb; }
        .dark body { background-color: #030712; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Fallback ID generator (avoids crypto API crashes on file://)
        const generateId = () => Math.random().toString(36).substring(2, 15) + Date.now().toString(36);

        const translations = {
            en: {
                appTitle: "Arabic RTL Booklet Maker",
                uploadTab: "1. Upload",
                sortTab: "2. Sort & Verify",
                previewTab: "3. Preview & Export",
                uploadAreaTitle: "Drag & drop images or ZIP file here",
                uploadAreaSub: "Supports PNG, JPG, JPEG, and ZIP formats",
                orClickToBrowse: "or click to browse",
                processingFiles: "Processing files...",
                extractingNumbers: "Extracting page numbers with OCR...",
                noImages: "No images uploaded yet.",
                page: "Page",
                confidence: "OCR Confidence",
                lowConfidence: "Low Confidence",
                sortInstruction: "Drag to reorder pages. The list order determines the final page number.",
                generateLayout: "Generate Booklet Layout",
                downloadPDF: "Download Print-Ready PDF",
                downloadZIP: "Download Renamed ZIP",
                sheet: "Sheet",
                left: "Left",
                right: "Right",
                blankPage: "[ Blank Page ]",
                clearAll: "Clear All",
                back: "Back",
                autoSort: "Auto-Sort by OCR Num",
                localWarning: "Running locally! OCR might be blocked by browser security. You can still sort manually."
            },
            ar: {
                appTitle: "صانع الكتيبات العربية",
                uploadTab: "١. الرفع",
                sortTab: "٢. الترتيب والتحقق",
                previewTab: "٣. المعاينة والتصدير",
                uploadAreaTitle: "اسحب وأفلت الصور أو ملف ZIP هنا",
                uploadAreaSub: "يدعم صيغ PNG و JPG و JPEG و ZIP",
                orClickToBrowse: "أو انقر للتصفح",
                processingFiles: "جاري معالجة الملفات...",
                extractingNumbers: "جاري استخراج أرقام الصفحات...",
                noImages: "لم يتم رفع أي صور بعد.",
                page: "صفحة",
                confidence: "دقة التعرف",
                lowConfidence: "دقة منخفضة",
                sortInstruction: "اسحب لإعادة ترتيب الصفحات. ترتيب القائمة يحدد رقم الصفحة النهائي.",
                generateLayout: "إنشاء تخطيط الكتيب",
                downloadPDF: "تحميل PDF جاهز للطباعة",
                downloadZIP: "تحميل ZIP بالصور المعادة تسميتها",
                sheet: "ورقة",
                left: "يسار",
                right: "يمين",
                blankPage: "[ صفحة فارغة ]",
                clearAll: "مسح الكل",
                back: "رجوع",
                autoSort: "ترتيب تلقائي بالذكاء الاصطناعي",
                localWarning: "العمل محلياً! قد يمنع المتصفح ميزة التعرف على النصوص. لا يزال بإمكانك الترتيب يدوياً."
            }
        };

        function App() {
            const [lang, setLang] = useState('en');
            const [theme, setTheme] = useState('light');
            const [step, setStep] = useState(1);
            const [images, setImages] = useState([]);
            const [pairs, setPairs] = useState([]);
            
            const [isProcessing, setIsProcessing] = useState(false);
            const [ocrProgress, setOcrProgress] = useState({ current: 0, total: 0 });
            const [isExporting, setIsExporting] = useState(false);
            const [ocrError, setOcrError] = useState(false);

            const t = translations[lang];
            const isRtl = lang === 'ar';
            const isLocalFile = window.location.protocol === 'file:';

            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            const handleFileUpload = async (files) => {
                setIsProcessing(true);
                const newImages = [];

                const loadImage = (url) => new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = url;
                });

                const readFile = (file) => new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    if (file.name.toLowerCase().endsWith('.zip')) {
                        try {
                            const zip = await window.JSZip.loadAsync(file);
                            const zipFiles = Object.values(zip.files).filter(f => !f.dir && f.name.match(/\.(png|jpe?g)$/i));
                            
                            for (const zipFile of zipFiles) {
                                const base64 = await zipFile.async('base64');
                                const dataUrl = `data:image/jpeg;base64,${base64}`;
                                const imgEl = await loadImage(dataUrl);
                                newImages.push({
                                    id: generateId(), dataUrl, width: imgEl.width, height: imgEl.height,
                                    detectedPage: null, ocrConfidence: 0, originalName: zipFile.name
                                });
                            }
                        } catch (err) {
                            console.error("ZIP parsing error:", err);
                        }
                    } else if (file.type.startsWith('image/')) {
                        const dataUrl = await readFile(file);
                        const imgEl = await loadImage(dataUrl);
                        newImages.push({
                            id: generateId(), dataUrl, width: imgEl.width, height: imgEl.height,
                            detectedPage: null, ocrConfidence: 0, originalName: file.name
                        });
                    }
                }

                setImages(prev => [...prev, ...newImages]);
                setIsProcessing(false);
                if (newImages.length > 0) {
                    setStep(2);
                    runOCR(newImages);
                }
            };

            const runOCR = async (imgsToProcess) => {
                setIsProcessing(true);
                setOcrError(false);
                
                try {
                    // This is where browser security blocks workers on file://
                    const worker = await window.Tesseract.createWorker('eng+ara');
                    
                    for (let i = 0; i < imgsToProcess.length; i++) {
                        setOcrProgress({ current: i + 1, total: imgsToProcess.length });
                        const img = imgsToProcess[i];
                        
                        const ret = await worker.recognize(img.dataUrl);
                        let text = ret.data.text;
                        
                        const easternToWestern = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
                        text = text.replace(/[٠-٩]/g, m => easternToWestern[m]);
                        
                        const matches = text.match(/\d+/g);
                        let num = null;
                        if (matches) num = parseInt(matches[matches.length - 1], 10);

                        setImages(prev => prev.map(p => 
                            p.id === img.id ? { ...p, detectedPage: num, ocrConfidence: ret.data.confidence } : p
                        ));
                    }
                    await worker.terminate();
                } catch (e) {
                    console.warn("OCR completely blocked by browser security.", e);
                    setOcrError(true); // Tell UI to show manual sort message
                }
                setIsProcessing(false);
                setOcrProgress({ current: 0, total: 0 });
            };

            const handleDragStart = (e, index) => {
                e.dataTransfer.setData('text/plain', index.toString());
            };

            const handleDrop = (e, index) => {
                e.preventDefault();
                const draggedIndex = parseInt(e.dataTransfer.getData('text/plain'));
                if (draggedIndex === index || isNaN(draggedIndex)) return;

                const newImages = [...images];
                const [draggedItem] = newImages.splice(draggedIndex, 1);
                newImages.splice(index, 0, draggedItem);
                setImages(newImages);
            };

            const autoSort = () => {
                const sorted = [...images].sort((a, b) => {
                    const pA = a.detectedPage ?? 99999;
                    const pB = b.detectedPage ?? 99999;
                    return pA - pB;
                });
                setImages(sorted);
            };

            const generateLayout = () => {
                const total = images.length;
                const paddedTotal = Math.ceil(total / 4) * 4;
                
                const pages = new Array(paddedTotal).fill(null);
                images.forEach((img, index) => { pages[index] = img; });

                const newPairs = [];
                for (let k = 1; k <= paddedTotal / 2; k++) {
                    if (k % 2 !== 0) {
                        newPairs.push({
                            left: pages[k - 1] || null, right: pages[paddedTotal - k] || null,
                            leftPageNum: k, rightPageNum: paddedTotal - k + 1, sheet: Math.ceil(k / 2)
                        });
                    } else {
                        newPairs.push({
                            left: pages[paddedTotal - k] || null, right: pages[k - 1] || null,
                            leftPageNum: paddedTotal - k + 1, rightPageNum: k, sheet: Math.ceil(k / 2)
                        });
                    }
                }

                setPairs(newPairs);
                setStep(3);
            };

            const exportPDF = () => {
                setIsExporting(true);
                setTimeout(() => {
                    try {
                        const { jsPDF } = window.jspdf;
                        const pdf = new jsPDF({ orientation: 'l', unit: 'mm', format: 'a4' });
                        
                        pairs.forEach((pair, index) => {
                            if (index > 0) pdf.addPage();
                            
                            const renderImg = (img, xOffset) => {
                                if (!img) return;
                                const maxW = 148.5, maxH = 210;
                                const ratio = Math.min(maxW / img.width, maxH / img.height);
                                const w = img.width * ratio, h = img.height * ratio;
                                const x = xOffset + (maxW - w) / 2, y = (maxH - h) / 2;
                                pdf.addImage(img.dataUrl, 'JPEG', x, y, w, h);
                            };

                            renderImg(pair.left, 0);
                            renderImg(pair.right, 148.5);
                        });
                        pdf.save('Arabic_RTL_Booklet.pdf');
                    } catch (err) {
                        console.error("PDF Export Error:", err);
                        alert("Error creating PDF");
                    }
                    setIsExporting(false);
                }, 100);
            };

            const exportZIP = async () => {
                setIsExporting(true);
                try {
                    const zip = new window.JSZip();
                    images.forEach((img, index) => {
                        const base64Data = img.dataUrl.split(',')[1];
                        zip.file(`page_${String(index + 1).padStart(3, '0')}.jpg`, base64Data, { base64: true });
                    });
                    const content = await zip.generateAsync({ type: 'blob' });
                    window.saveAs(content, 'Renamed_Booklet_Pages.zip');
                } catch (err) {
                    console.error("ZIP Export Error:", err);
                }
                setIsExporting(false);
            };

            return (
                <div className={`min-h-screen text-gray-900 dark:text-gray-100 transition-colors duration-300 ${isRtl ? 'rtl' : 'ltr'}`} dir={isRtl ? 'rtl' : 'ltr'}>
                    <header className="border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 sticky top-0 z-10 shadow-sm">
                        <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3 text-indigo-600 dark:text-indigo-400">
                                <i className="fas fa-book-open text-2xl"></i>
                                <h1 className="font-bold text-xl hidden sm:block">{t.appTitle}</h1>
                            </div>
                            <div className="flex items-center gap-3">
                                <button onClick={() => setLang(l => l === 'en' ? 'ar' : 'en')} className="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                                    <i className="fas fa-language text-xl"></i>
                                </button>
                                <button onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')} className="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition text-xl">
                                    {theme === 'light' ? <i className="fas fa-moon"></i> : <i className="fas fa-sun"></i>}
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-8">
                        {isLocalFile && ocrError && (
                            <div className="mb-6 p-4 bg-orange-100 dark:bg-orange-900/30 border-l-4 border-orange-500 text-orange-800 dark:text-orange-200 rounded shadow-sm">
                                <i className="fas fa-exclamation-triangle mr-2"></i> {t.localWarning}
                            </div>
                        )}

                        <div className="flex justify-between items-center mb-10 overflow-x-auto pb-4 hide-scrollbar">
                            {[
                                { s: 1, label: t.uploadTab, active: step >= 1 },
                                { s: 2, label: t.sortTab, active: step >= 2 },
                                { s: 3, label: t.previewTab, active: step === 3 }
                            ].map((tab, i, arr) => (
                                <React.Fragment key={tab.s}>
                                    <div onClick={() => { if (tab.s < step) setStep(tab.s) }} className={`flex items-center gap-2 px-4 py-2 rounded-full font-medium transition-colors cursor-pointer whitespace-nowrap ${tab.active ? 'bg-indigo-600 text-white shadow-md' : 'bg-gray-200 dark:bg-gray-800 text-gray-500 dark:text-gray-400'}`}>
                                        {tab.label}
                                    </div>
                                    {i < arr.length - 1 && <div className={`flex-1 h-1 mx-2 rounded ${tab.active && step > tab.s ? 'bg-indigo-600' : 'bg-gray-200 dark:bg-gray-800'}`} />}
                                </React.Fragment>
                            ))}
                        </div>

                        <div className="bg-white dark:bg-gray-900 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-800 min-h-[60vh] p-6 lg:p-10 relative">
                            
                            {isProcessing && (
                                <div className="absolute inset-0 bg-white/90 dark:bg-gray-900/90 backdrop-blur-sm flex flex-col items-center justify-center z-20 rounded-2xl">
                                    <i className="fas fa-spinner fa-spin text-5xl text-indigo-600 mb-4"></i>
                                    <h3 className="text-xl font-bold text-center px-4">{t.processingFiles}</h3>
                                    {ocrProgress.total > 0 && (
                                        <div className="mt-4 w-full max-w-md px-6 text-center">
                                            <p className="mb-2 text-gray-600 dark:text-gray-400 font-medium text-sm">
                                                {t.extractingNumbers} <br/><br/>
                                                <span className="text-indigo-600 dark:text-indigo-400 font-bold text-lg">
                                                    {ocrProgress.current} / {ocrProgress.total}
                                                </span>
                                            </p>
                                        </div>
                                    )}
                                </div>
                            )}

                            {step === 1 && (
                                <div className="flex flex-col items-center justify-center h-full min-h-[50vh]">
                                    <label 
                                        className="w-full max-w-2xl flex flex-col items-center justify-center p-12 border-2 border-dashed border-indigo-300 dark:border-indigo-700 rounded-3xl bg-indigo-50 dark:bg-indigo-950/20 hover:bg-indigo-100 dark:hover:bg-indigo-900/30 transition-all cursor-pointer group"
                                        onDragOver={(e) => e.preventDefault()}
                                        onDrop={(e) => {
                                            e.preventDefault();
                                            if (e.dataTransfer.files) handleFileUpload(e.dataTransfer.files);
                                        }}
                                    >
                                        <div className="p-4 bg-indigo-100 dark:bg-indigo-900 rounded-full mb-4 group-hover:scale-110 transition-transform">
                                            <i className="fas fa-cloud-upload-alt text-4xl text-indigo-600 dark:text-indigo-400"></i>
                                        </div>
                                        <h3 className="text-xl font-bold mb-2 text-gray-800 dark:text-gray-200 text-center">{t.uploadAreaTitle}</h3>
                                        <p className="text-gray-500 dark:text-gray-400 mb-6 text-center">{t.uploadAreaSub}</p>
                                        <div className="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium shadow-md transition-colors">
                                            {t.orClickToBrowse}
                                        </div>
                                        <input type="file" multiple accept=".png,.jpg,.jpeg,.zip" className="hidden" onChange={(e) => e.target.files && handleFileUpload(e.target.files)} />
                                    </label>
                                </div>
                            )}

                            {step === 2 && !isProcessing && (
                                <div className="flex flex-col h-full fade-in duration-500">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                        <div>
                                            <h2 className="text-2xl font-bold">{t.sortTab}</h2>
                                            <p className="text-gray-500 dark:text-gray-400 mt-1">{t.sortInstruction}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={autoSort} className="px-4 py-2 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 rounded-lg text-sm font-medium transition flex items-center gap-2">
                                                <i className="fas fa-sort-numeric-down"></i> {t.autoSort}
                                            </button>
                                            <button onClick={() => { setImages([]); setStep(1); }} className="px-4 py-2 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg text-sm font-medium transition flex items-center gap-2">
                                                <i className="fas fa-trash-alt"></i> {t.clearAll}
                                            </button>
                                        </div>
                                    </div>

                                    {images.length === 0 ? (
                                        <div className="text-center py-10 text-gray-500">{t.noImages}</div>
                                    ) : (
                                        <div className="flex-1 overflow-y-auto pr-2 space-y-3 max-h-[50vh]">
                                            {images.map((img, index) => (
                                                <div 
                                                    key={img.id} draggable onDragStart={(e) => handleDragStart(e, index)} onDragOver={(e) => e.preventDefault()} onDrop={(e) => handleDrop(e, index)}
                                                    className="group flex items-center gap-4 p-3 bg-gray-50 dark:bg-gray-800/50 hover:bg-gray-100 dark:hover:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl transition-all cursor-move"
                                                >
                                                    <div className="text-gray-400 cursor-grab active:cursor-grabbing px-2 text-xl"><i className="fas fa-grip-vertical"></i></div>
                                                    <div className="relative w-16 h-20 shrink-0 bg-gray-200 dark:bg-gray-700 rounded overflow-hidden shadow-sm">
                                                        <img src={img.dataUrl} alt="page" className="w-full h-full object-cover" />
                                                        <div className="absolute top-0 right-0 bg-indigo-600 text-white text-xs font-bold px-1.5 py-0.5 rounded-bl">{index + 1}</div>
                                                    </div>
                                                    
                                                    <div className="flex-1 min-w-0">
                                                        <p className="text-sm font-medium truncate mb-1">{img.originalName}</p>
                                                        <div className="flex items-center gap-2 text-xs flex-wrap">
                                                            {img.detectedPage !== null ? (
                                                                <span className="inline-flex items-center gap-1 text-green-600 dark:text-green-400 bg-green-50 dark:bg-green-900/20 px-2 py-1 rounded">
                                                                    <i className="fas fa-check-circle"></i> OCR: {img.detectedPage}
                                                                </span>
                                                            ) : (
                                                                <span className="inline-flex items-center gap-1 text-gray-500 bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded">
                                                                    No OCR detected
                                                                </span>
                                                            )}
                                                            {img.ocrConfidence > 0 && img.ocrConfidence < 60 && (
                                                                <span className="inline-flex items-center gap-1 text-orange-600 dark:text-orange-400 bg-orange-50 dark:bg-orange-900/20 px-2 py-1 rounded">
                                                                    <i className="fas fa-exclamation-triangle"></i> {t.lowConfidence} ({Math.round(img.ocrConfidence)}%)
                                                                </span>
                                                            )}
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="px-4 text-center">
                                                        <div className="text-xs text-gray-500 mb-1">{t.page} (Final)</div>
                                                        <div className="text-xl font-bold w-12 text-center bg-transparent border-b-2 border-indigo-500 mx-auto">{index + 1}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    <div className="mt-8 flex justify-end">
                                        <button onClick={generateLayout} disabled={images.length === 0} className="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-xl font-bold shadow-lg shadow-indigo-600/20 transition-all flex items-center gap-2 text-lg">
                                            {t.generateLayout} {isRtl ? <i className="fas fa-arrow-left"></i> : <i className="fas fa-arrow-right"></i>}
                                        </button>
                                    </div>
                                </div>
                            )}

                            {step === 3 && (
                                <div className="flex flex-col h-full fade-in duration-500">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                                        <div>
                                            <h2 className="text-2xl font-bold">{t.previewTab}</h2>
                                            <p className="text-gray-500 dark:text-gray-400 mt-1">Total pages: {images.length}. Padded to {pairs.length * 2} for RTL format.</p>
                                        </div>
                                        <div className="flex flex-wrap gap-3">
                                            <button onClick={() => setStep(2)} className="px-4 py-2 border border-gray-300 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 rounded-lg font-medium transition flex items-center gap-2">
                                                {isRtl ? <i className="fas fa-arrow-right"></i> : <i className="fas fa-arrow-left"></i>} {t.back}
                                            </button>
                                            <button onClick={exportZIP} disabled={isExporting} className="px-4 py-2 bg-gray-800 hover:bg-gray-900 dark:bg-gray-700 dark:hover:bg-gray-600 text-white rounded-lg font-medium transition flex items-center gap-2 disabled:opacity-70">
                                                <i className="fas fa-file-archive"></i> {t.downloadZIP}
                                            </button>
                                            <button onClick={exportPDF} disabled={isExporting} className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold shadow-md transition flex items-center gap-2 disabled:opacity-70">
                                                {isExporting ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-download"></i>} {t.downloadPDF}
                                            </button>
                                        </div>
                                    </div>

                                    <div className="bg-gray-100 dark:bg-gray-950 p-6 rounded-2xl overflow-y-auto max-h-[60vh]">
                                        <div className="flex flex-col items-center gap-10">
                                            {pairs.map((pair, idx) => (
                                                <div key={idx} className="w-full max-w-3xl">
                                                    <h4 className="text-center font-bold mb-3 text-gray-600 dark:text-gray-400">
                                                        {t.sheet} {pair.sheet} {idx % 2 === 0 ? '(Front)' : '(Back)'}
                                                    </h4>
