<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Color Rush - Arcade Card Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Luckiest+Guy&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1326;
    --gold:#ffd45e;
    --gold-deep:#e8a82e;
    --c-red:#ff4d62;
    --c-yellow:#ffc63d;
    --c-green:#2fd07e;
    --c-blue:#3a86ff;
    --ink:#0c1a2e;
    --paper:#f7f4ec;
    --text:#eef2fb;
    --muted:#8ea0c2;
    --card-w:14vmin;
    --card-r:1.6vmin;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    font-family:'Sora',system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(120% 90% at 50% 0%, #1b2c4a 0%, #0d1730 45%, #070c1a 100%);
    user-select:none;-webkit-user-select:none;
    height:100dvh;
  }
  .screen{position:fixed;inset:0;display:none;flex-direction:column;}
  .screen.on{display:flex;}

  /* ---------- HOME ---------- */
  #home{align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;
    background:
      radial-gradient(80% 60% at 50% 18%, rgba(255,212,94,.10), transparent 60%),
      radial-gradient(120% 90% at 50% 0%, #1b2c4a 0%, #0d1730 45%, #070c1a 100%);}
  .logo{
    font-family:'Luckiest Guy',cursive;line-height:.92;letter-spacing:1px;
    text-transform:uppercase;
  }
  .logo .l1{display:block;font-size:clamp(44px,15vw,96px);
    color:var(--gold);
    text-shadow:0 4px 0 var(--gold-deep), 0 10px 28px rgba(255,180,60,.45);}
  .logo .l2{display:block;font-size:clamp(20px,6.2vw,38px);color:#fff;
    -webkit-text-stroke:2px #0a1120;
    text-shadow:0 3px 0 #0a1120;}
  .tag{color:var(--muted);font-size:14px;margin:10px 0 26px;max-width:330px;}
  .deck-spread{display:flex;justify-content:center;margin-bottom:6px;height:96px;}
  .deck-spread .card{position:relative;}
  .panel{width:min(440px,92vw);background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:20px;
    backdrop-filter:blur(6px);}
  .panel h2{font-family:'Fredoka';margin:0 0 14px;font-size:18px;color:#cfe;letter-spacing:.5px;text-transform:uppercase;}
  .diffs{display:grid;gap:12px;}
  .diff{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;
    border:2px solid rgba(255,255,255,.10);background:rgba(255,255,255,.03);
    cursor:pointer;transition:transform .12s, border-color .15s, background .15s;text-align:left;}
  .diff:active{transform:scale(.98);}
  .diff.sel{border-color:var(--gold);background:rgba(255,212,94,.10);}
  .diff .dot{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
    font-family:'Fredoka';font-weight:700;font-size:20px;color:#06101f;flex:0 0 auto;}
  .diff.easy .dot{background:linear-gradient(160deg,#5be3a0,#2fd07e);}
  .diff.medium .dot{background:linear-gradient(160deg,#ffe07a,#ffc63d);}
  .diff.hard .dot{background:linear-gradient(160deg,#ff7a8c,#ff4d62);}
  .diff .name{font-family:'Fredoka';font-weight:600;font-size:17px;}
  .diff .desc{font-size:12px;color:var(--muted);margin-top:2px;}
  .diff .rec{margin-left:auto;font-size:11px;color:var(--gold);font-weight:600;}
  .btn{font-family:'Fredoka';font-weight:700;border:none;cursor:pointer;color:#06101f;
    background:linear-gradient(180deg,#ffe28a,var(--gold));border-radius:16px;
    padding:16px;font-size:19px;letter-spacing:.5px;box-shadow:0 6px 0 var(--gold-deep);
    transition:transform .1s, box-shadow .1s;width:100%;margin-top:16px;text-transform:uppercase;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-deep);}
  .stats{margin-top:16px;font-size:12px;color:var(--muted);}
  .stats b{color:var(--text);}

  /* ---------- GAME TABLE ---------- */
  #game{padding:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding:max(10px,env(safe-area-inset-top)) 14px 6px;}
  .pill{display:flex;align-items:center;gap:8px;font-family:'Fredoka';font-weight:600;font-size:13px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
    padding:7px 12px;border-radius:30px;}
  .iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);color:var(--text);display:grid;place-items:center;cursor:pointer;font-size:16px;}
  .iconbtn:active{transform:scale(.94);}

  .table{flex:1;position:relative;}
  /* seats */
  .seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:3;}
  .seat.top{top:6px;left:50%;transform:translateX(-50%);}
  .seat.left{left:8px;top:42%;transform:translateY(-50%);}
  .seat.right{right:8px;top:42%;transform:translateY(-50%);}
  .avatar{width:13vmin;max-width:64px;aspect-ratio:1;border-radius:50%;
    border:3px solid rgba(255,255,255,.25);background:linear-gradient(160deg,#28406e,#16243f);
    display:grid;place-items:center;font-family:'Fredoka';font-weight:700;font-size:5vmin;color:#bcd2ff;
    position:relative;transition:border-color .2s, box-shadow .2s;}
  .seat.active .avatar{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,212,94,.25),0 0 24px rgba(255,212,94,.55);}
  .nametag{font-family:'Fredoka';font-weight:600;font-size:12px;background:rgba(0,0,0,.35);
    padding:2px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.1);}
  .handcount{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 5px;
    border-radius:14px;background:var(--c-red);color:#fff;font-family:'Fredoka';font-weight:700;
    font-size:12px;display:grid;place-items:center;border:2px solid #1a0c12;}
  .minifan{display:flex;height:7vmin;max-height:34px;}
  .minifan .mc{width:5vmin;max-width:24px;height:7vmin;max-height:34px;margin-left:-3vmin;
    border-radius:3px;border:1.5px solid rgba(255,255,255,.5);
    background:repeating-linear-gradient(45deg,#c0233a,#c0233a 4px,#9e1b30 4px,#9e1b30 8px);}
  .minifan .mc:first-child{margin-left:0;}
  .uno-flag{font-family:'Luckiest Guy';color:var(--gold);font-size:13px;letter-spacing:1px;
    text-shadow:0 1px 0 #000;height:14px;}

  /* center */
  .center{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);
    display:flex;align-items:center;gap:7vmin;z-index:2;}
  .pile{position:relative;}
  .drawpile{cursor:pointer;}
  .drawpile .card{filter:brightness(.96);}
  .drawpile.can::after{content:"";position:absolute;inset:-7px;border-radius:calc(var(--card-r) + 7px);
    border:3px solid var(--gold);animation:pulse 1.1s infinite;}
  .draw-count{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
    background:#06101f;border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:1px 9px;
    font-family:'Fredoka';font-weight:600;font-size:11px;color:var(--muted);}
  .discard{position:relative;}
  .dirring{position:absolute;inset:-12px;border-radius:50%;pointer-events:none;}
  .dirring svg{width:100%;height:100%;animation:spin 9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}

  /* my hand */
  .myzone{position:absolute;bottom:0;left:0;right:0;z-index:4;
    padding-bottom:env(safe-area-inset-bottom);}
  .myrow{display:flex;align-items:flex-end;justify-content:flex-start;gap:8px;
    padding:10px 14px 6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;}
  .myrow::-webkit-scrollbar{display:none;}
  .myrow .card{flex:0 0 auto;transition:transform .14s;}
  .myrow .card.playable{cursor:pointer;}
  .myrow .card.playable:active{transform:translateY(-10px) scale(1.04);}
  .myrow .card.dim{opacity:.42;filter:grayscale(.4);}
  .mybar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px 12px;}
  .mybar .who{font-family:'Fredoka';font-weight:600;font-size:14px;}
  .turnhint{font-size:12px;color:var(--gold);font-family:'Fredoka';font-weight:600;height:16px;}
  .actbtn{font-family:'Fredoka';font-weight:700;border:none;border-radius:14px;padding:11px 18px;
    font-size:15px;cursor:pointer;color:#06101f;}
  .pass{background:rgba(255,255,255,.12);color:var(--text);border:1px solid rgba(255,255,255,.18);}
  .pass:active{transform:scale(.96);}
  #unoBtn{background:linear-gradient(180deg,#ff8aa0,var(--c-red));color:#fff;
    font-family:'Luckiest Guy';letter-spacing:2px;font-size:20px;display:none;
    box-shadow:0 5px 0 #b21d34;animation:shake .5s infinite;}
  #unoBtn.on{display:inline-block;}
  @keyframes shake{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}

  /* ---------- CARD ---------- */
  .card{width:var(--card-w);aspect-ratio:0.66;border-radius:var(--card-r);position:relative;
    border:2px solid rgba(255,255,255,.85);box-shadow:0 6px 14px rgba(0,0,0,.45);overflow:hidden;}
  .card.red{background:var(--c-red);}
  .card.yellow{background:var(--c-yellow);}
  .card.green{background:var(--c-green);}
  .card.blue{background:var(--c-blue);}
  .card.wild{background:#16161c;}
  .card.wild .quad{position:absolute;inset:0;border-radius:inherit;
    background:conic-gradient(var(--c-red) 0 25%,var(--c-blue) 25% 50%,var(--c-green) 50% 75%,var(--c-yellow) 75% 100%);
    opacity:.92;}
  .card .oval{position:absolute;inset:14% 10%;border-radius:50%/40%;
    background:rgba(255,255,255,.92);transform:rotate(-22deg);display:grid;place-items:center;}
  .card.wild .oval{background:#0d0d12;border:2px solid rgba(255,255,255,.3);}
  .card .big{transform:rotate(22deg);font-family:'Fredoka';font-weight:700;color:var(--ink);
    font-size:7vmin;line-height:1;}
  .card.wild .big{color:#fff;}
  .card .big svg{width:7vmin;height:7vmin;display:block;}
  .card .corner{position:absolute;font-family:'Fredoka';font-weight:700;color:#fff;font-size:3vmin;
    line-height:1;text-shadow:0 1px 1px rgba(0,0,0,.4);}
  .card .corner svg{width:3vmin;height:3vmin;display:block;}
  .card .tl{top:5%;left:7%;}
  .card .br{bottom:5%;right:7%;transform:rotate(180deg);}
  .card.back{background:linear-gradient(150deg,#c0233a,#7a1322);border-color:rgba(255,255,255,.6);}
  .card.back .oval{inset:18% 14%;background:#0a1120;border:2px solid rgba(255,255,255,.25);transform:rotate(-22deg);}
  .card.back .rush{transform:rotate(22deg);font-family:'Luckiest Guy';color:var(--gold);font-size:2.6vmin;letter-spacing:.5px;}
  /* corner cards (back, in piles) */
  .card.sm{width:13vmin;}
  .center .card{width:16vmin;}
  @media(min-width:520px){
    :root{--card-w:78px;}
    .center .card{width:96px;}
    .card .big{font-size:42px;}
    .card .big svg{width:42px;height:42px;}
    .card .corner{font-size:17px;}
    .card .corner svg{width:17px;height:17px;}
    .card.back .rush{font-size:15px;}
  }

  /* flying card */
  .flyer{position:fixed;z-index:50;pointer-events:none;transition:all .42s cubic-bezier(.3,.8,.3,1);}

  /* ---------- OVERLAY ---------- */
  .overlay{position:fixed;inset:0;background:rgba(4,8,18,.78);z-index:60;
    display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px);padding:24px;}
  .overlay.on{display:flex;}
  .picker{background:#101a30;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:24px;text-align:center;width:min(360px,90vw);}
  .picker h3{font-family:'Fredoka';margin:0 0 16px;font-size:20px;}
  .colors{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .colorpick{height:74px;border-radius:18px;border:3px solid rgba(255,255,255,.2);cursor:pointer;
    display:grid;place-items:center;font-family:'Fredoka';font-weight:700;color:#06101f;font-size:15px;}
  .colorpick:active{transform:scale(.96);}
  .cp-red{background:var(--c-red);}.cp-yellow{background:var(--c-yellow);}
  .cp-green{background:var(--c-green);}.cp-blue{background:var(--c-blue);color:#fff;}

  .result{background:#101a30;border:1px solid rgba(255,255,255,.12);border-radius:24px;
    padding:30px 26px;text-align:center;width:min(380px,90vw);}
  .result .crown{font-size:54px;margin-bottom:6px;}
  .result h2{font-family:'Luckiest Guy';margin:0;font-size:34px;letter-spacing:1px;}
  .result .win{color:var(--gold);text-shadow:0 3px 0 var(--gold-deep);}
  .result .lose{color:#9fb2d6;}
  .result p{color:var(--muted);font-size:14px;margin:8px 0 0;}

  /* toast */
  #toast{position:fixed;top:18%;left:50%;transform:translateX(-50%) scale(.7);z-index:70;
    font-family:'Luckiest Guy';font-size:30px;letter-spacing:1px;color:#fff;
    text-shadow:0 3px 0 #000,0 0 24px rgba(255,212,94,.6);opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;text-align:center;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) scale(1);}

  @media (prefers-reduced-motion: reduce){
    .flyer{transition:none;} #unoBtn{animation:none;} .dirring svg{animation:none;} .drawpile.can::after{animation:none;}
  }
</style>
</head>
<body>

<!-- ===== HOME ===== -->
<section id="home" class="screen on">
  <div class="logo"><span class="l1">Color</span><span class="l2">Rush</span></div>
  <p class="tag">Match the color or number, blast through your hand, and shout UNO before the bots beat you to it.</p>
  <div class="deck-spread" id="deckSpread"></div>
  <div class="panel">
    <h2>Choose difficulty</h2>
    <div class="diffs">
      <button class="diff easy" data-diff="easy"><span class="dot">E</span><span><span class="name">Easy</span><span class="desc">Bots play random cards. Great for warming up.</span></span></button>
      <button class="diff medium sel" data-diff="medium"><span class="dot">M</span><span><span class="name">Medium</span><span class="desc">Bots match colors and save their wilds.</span></span><span class="rec">popular</span></button>
      <button class="diff hard" data-diff="hard"><span class="dot">H</span><span><span class="name">Hard</span><span class="desc">Bots count cards and gang up on you.</span></span></button>
    </div>
    <button class="btn" id="startBtn">Deal me in</button>
    <div class="stats" id="homeStats"></div>
  </div>
</section>

<!-- ===== GAME ===== -->
<section id="game" class="screen">
  <div class="topbar">
    <div class="pill" id="diffPill">Medium</div>
    <div class="pill" id="dirPill"><span id="dirArrow">&#8635;</span> <span id="dirText">clockwise</span></div>
    <div style="display:flex;gap:8px;">
      <button class="iconbtn" id="soundBtn" title="Sound">&#9834;</button>
      <button class="iconbtn" id="quitBtn" title="Quit">&times;</button>
    </div>
  </div>

  <div class="table" id="tableArea">
    <!-- seats -->
    <div class="seat top" id="seat-2">
      <div class="uno-flag" id="uno-2"></div>
      <div class="minifan" id="fan-2"></div>
      <div class="avatar" id="av-2"><span class="handcount" id="hc-2">7</span></div>
      <div class="nametag" id="nm-2">Bot</div>
    </div>
    <div class="seat left" id="seat-1">
      <div class="uno-flag" id="uno-1"></div>
      <div class="minifan" id="fan-1"></div>
      <div class="avatar" id="av-1"><span class="handcount" id="hc-1">7</span></div>
      <div class="nametag" id="nm-1">Bot</div>
    </div>
    <div class="seat right" id="seat-3">
      <div class="uno-flag" id="uno-3"></div>
      <div class="minifan" id="fan-3"></div>
      <div class="avatar" id="av-3"><span class="handcount" id="hc-3">7</span></div>
      <div class="nametag" id="nm-3">Bot</div>
    </div>

    <!-- center piles -->
    <div class="center">
      <div class="pile drawpile" id="drawPile">
        <div class="card back sm"><div class="oval"><span class="rush">RUSH</span></div></div>
        <div class="draw-count" id="drawCount">0</div>
      </div>
      <div class="pile discard" id="discardPile">
        <div class="dirring" id="dirRing"></div>
        <!-- top card injected -->
      </div>
    </div>

    <!-- my zone -->
    <div class="myzone">
      <div class="myrow" id="myRow"></div>
      <div class="mybar">
        <div>
          <div class="who" id="meName">You <span class="handcount" style="position:static;display:inline-grid;margin-left:4px" id="hc-0">7</span></div>
          <div class="turnhint" id="turnHint"></div>
        </div>
        <div style="display:flex;gap:10px;">
          <button class="actbtn pass" id="passBtn" style="display:none">Pass</button>
          <button class="actbtn" id="unoBtn">UNO!</button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- overlays -->
<div class="overlay" id="colorOverlay">
  <div class="picker">
    <h3>Pick a color</h3>
    <div class="colors">
      <button class="colorpick cp-red" data-color="red">Red</button>
      <button class="colorpick cp-yellow" data-color="yellow">Yellow</button>
      <button class="colorpick cp-green" data-color="green">Green</button>
      <button class="colorpick cp-blue" data-color="blue">Blue</button>
    </div>
  </div>
</div>

<div class="overlay" id="resultOverlay">
  <div class="result">
    <div class="crown" id="resCrown">&#127942;</div>
    <h2 id="resTitle" class="win">You win!</h2>
    <p id="resSub"></p>
    <button class="btn" id="againBtn">Play again</button>
    <button class="actbtn pass" id="menuBtn" style="width:100%;margin-top:10px;">Main menu</button>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
(function(){
  // ---------- constants ----------
  var COLORS = ["red","yellow","green","blue"];
  var COLOR_HEX = {red:"#ff4d62",yellow:"#ffc63d",green:"#2fd07e",blue:"#3a86ff"};
  var BOT_POOL = ["Rageclaw","Shyshell","Lucas","Eva","Lee","Larissa","Jack","Ronaldo","Nova","Zane"];
  var SEAT_CLASS = {1:"left",2:"top",3:"right"};

  // ---------- SVG icons for action cards ----------
  function svgSkip(c){c=c||"currentColor";return '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="'+c+'" stroke-width="2.6"/><line x1="6" y1="6" x2="18" y2="18" stroke="'+c+'" stroke-width="2.6"/></svg>';}
  function svgReverse(c){c=c||"currentColor";return '<svg viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l-4 4 4 4"/><path d="M4 9h11a4 4 0 0 1 4 4"/><path d="M16 19l4-4-4-4" transform="translate(0 0)"/><path d="M20 15H9a4 4 0 0 1-4-4" opacity="0"/></svg>';}
  function iconFor(card,colorCtx){
    // returns html for big center symbol; colorCtx = ink color for the symbol on the oval
    var ink = card.color==="wild" ? "#fff" : "#0c1a2e";
    if(card.kind==="skip") return svgSkip(ink);
    if(card.kind==="reverse") return svgReverse(ink);
    if(card.kind==="draw2") return '<span>+2</span>';
    if(card.kind==="wild") return '<span style="font-size:.7em">WILD</span>';
    if(card.kind==="wild4") return '<span>+4</span>';
    return '<span>'+card.value+'</span>';
  }
  function cornerFor(card){
    if(card.kind==="skip") return svgSkip("#fff");
    if(card.kind==="reverse") return svgReverse("#fff");
    if(card.kind==="draw2") return "+2";
    if(card.kind==="wild") return "W";
    if(card.kind==="wild4") return "+4";
    return ""+card.value;
  }

  // ---------- card html ----------
  function cardHTML(card,opts){
    opts = opts||{};
    var cls = "card "+(card.color==="wild"?"wild":card.color);
    if(opts.cls) cls += " "+opts.cls;
    var inner = "";
    if(card.color==="wild") inner += '<div class="quad"></div>';
    inner += '<div class="oval"><span class="big">'+iconFor(card)+'</span></div>';
    var cn = cornerFor(card);
    inner += '<span class="corner tl">'+cn+'</span><span class="corner br">'+cn+'</span>';
    return '<div class="'+cls+'">'+inner+'</div>';
  }

  // ---------- deck ----------
  function buildDeck(){
    var d=[];
    COLORS.forEach(function(col){
      d.push({color:col,kind:"num",value:0});
      for(var n=1;n<=9;n++){ d.push({color:col,kind:"num",value:n}); d.push({color:col,kind:"num",value:n}); }
      ["skip","reverse","draw2"].forEach(function(k){
        d.push({color:col,kind:k,value:null}); d.push({color:col,kind:k,value:null});
      });
    });
    for(var i=0;i<4;i++){ d.push({color:"wild",kind:"wild",value:null}); d.push({color:"wild",kind:"wild4",value:null}); }
    return d;
  }
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
    return a;
  }

  // ---------- game state ----------
  var G = null;
  function newGame(diff){
    var deck = shuffle(buildDeck());
    var names = shuffle(BOT_POOL.slice()).slice(0,3);
    var players = [
      {id:0,name:"You",human:true,hand:[],calledUno:false},
      {id:1,name:names[0],human:false,hand:[],calledUno:false},
      {id:2,name:names[1],human:false,hand:[],calledUno:false},
      {id:3,name:names[2],human:false,hand:[],calledUno:false}
    ];
    for(var p=0;p<4;p++){ for(var c=0;c<7;c++){ players[p].hand.push(deck.pop()); } }
    // first discard: must be a number card to avoid messy starts
    var first;
    while(true){ first = deck.pop(); if(first.kind==="num"){ break; } deck.unshift(first); }
    G = {
      diff:diff, deck:deck, discard:[first],
      currentColor:first.color, players:players,
      turn:0, dir:1, over:false, busy:false,
      unoTimer:null, justDrew:false, pendingPlayDrawn:null
    };
    G.turn = Math.floor(Math.random()*4); // random starter
  }

  function topCard(){ return G.discard[G.discard.length-1]; }
  function nextIndex(from,dir){ return (from + dir + 4) % 4; }

  function canPlay(card){
    var top = topCard();
    if(card.color==="wild") return true;
    if(card.color===G.currentColor) return true;
    if(card.kind==="num" && top.kind==="num" && card.value===top.value) return true;
    if(card.kind!=="num" && card.kind===top.kind) return true;
    return false;
  }

  // ---------- rendering ----------
  function $(id){return document.getElementById(id);}
  function renderAll(){
    // discard top
    var dp = $("discardPile");
    var ring = $("dirRing");
    var existing = dp.querySelector(".card");
    if(existing) existing.remove();
    dp.insertAdjacentHTML("beforeend", cardHTML(topCard()));
    // tint discard glow by current color
    var hex = G.currentColor==="wild" ? "#ffffff" : COLOR_HEX[G.currentColor];
    dp.querySelector(".card").style.boxShadow = "0 8px 20px rgba(0,0,0,.5), 0 0 30px "+hex+"aa";
    // direction ring
    ring.innerHTML = '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="46" stroke="'+hex+'" stroke-width="3" stroke-dasharray="10 14" opacity=".7"/></svg>';
    ring.querySelector("svg").style.animationDirection = G.dir===1 ? "normal":"reverse";

    $("drawCount").textContent = G.deck.length;

    // bots
    [1,2,3].forEach(function(i){
      var pl=G.players[i];
      $("nm-"+i).textContent = pl.name;
      $("av-"+i).innerHTML = '<span class="handcount" id="hc-'+i+'">'+pl.hand.length+'</span>'+initials(pl.name);
      $("seat-"+i).classList.toggle("active", G.turn===i && !G.over);
      $("uno-"+i).textContent = (pl.hand.length===1 && pl.calledUno) ? "UNO!" : "";
      // mini fan (cap at 7 visible)
      var fan=$("fan-"+i); fan.innerHTML="";
      var show=Math.min(pl.hand.length,7);
      for(var k=0;k<show;k++){ var m=document.createElement("div"); m.className="mc"; fan.appendChild(m); }
    });

    // me
    $("hc-0").textContent = G.players[0].hand.length;
    $("meName").classList.toggle("active", G.turn===0);
    renderMyHand();
    updateTurnHint();
  }
  function initials(n){ return n.charAt(0).toUpperCase(); }

  function renderMyHand(){
    var row=$("myRow"); row.innerHTML="";
    var myTurn = (G.turn===0 && !G.over && !G.busy);
    G.players[0].hand.forEach(function(card,idx){
      var playable = myTurn && canPlay(card);
      // if we just drew and have a pending-only-drawn rule, restrict to drawn card
      if(myTurn && G.justDrew && G.pendingPlayDrawn!==null){
        playable = (idx===G.pendingPlayDrawn) && canPlay(card);
      }
      var div=document.createElement("div");
      div.innerHTML = cardHTML(card,{cls: playable?"playable":(myTurn?"dim":"")});
      var el=div.firstChild;
      if(playable){ el.addEventListener("click", function(){ humanPlay(idx); }); }
      row.appendChild(el);
    });
  }

  function updateTurnHint(){
    var h=$("turnHint");
    if(G.over){ h.textContent=""; return; }
    if(G.turn===0){
      var any = G.players[0].hand.some(canPlay);
      if(G.justDrew && G.pendingPlayDrawn!==null){ h.textContent="Play it or pass"; }
      else if(any){ h.textContent="Your turn - tap a glowing card"; }
      else { h.textContent="No moves - draw a card"; }
      $("drawPile").classList.add("can");
    } else {
      h.textContent = G.players[G.turn].name+" is thinking...";
      $("drawPile").classList.remove("can");
    }
  }

  // ---------- toast ----------
  function toast(msg,color){
    var t=$("toast"); t.textContent=msg;
    t.style.color = color || "#fff";
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t=setTimeout(function(){ t.classList.remove("show"); },1100);
  }

  // ---------- sound (tiny WebAudio) ----------
  var AC=null, soundOn=true;
  function beep(freq,dur,type,vol){
    if(!soundOn) return;
    try{
      if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type||"sine"; o.frequency.value=freq;
      g.gain.value=vol||0.06;
      o.connect(g); g.connect(AC.destination);
      var now=AC.currentTime; o.start(now);
      g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
      o.stop(now+dur);
    }catch(e){}
  }
  function sfxPlay(){ beep(420,0.12,"triangle",0.08); }
  function sfxDraw(){ beep(240,0.1,"sine",0.06); }
  function sfxAction(){ beep(640,0.14,"square",0.05); }
  function sfxWin(){ beep(523,0.15,"triangle",0.09); setTimeout(function(){beep(659,0.15,"triangle",0.09);},140); setTimeout(function(){beep(784,0.25,"triangle",0.09);},290); }
  function sfxLose(){ beep(300,0.2,"sawtooth",0.05); setTimeout(function(){beep(200,0.3,"sawtooth",0.05);},160); }

  // ---------- fly animation ----------
  function flyCard(card, fromRect, toEl, cb){
    var toRect = toEl.getBoundingClientRect();
    var fly=document.createElement("div");
    fly.className="flyer";
    fly.innerHTML = (card==="back")
      ? '<div class="card back"><div class="oval"><span class="rush">RUSH</span></div></div>'
      : cardHTML(card);
    var inner=fly.firstChild;
    inner.style.width = toRect.width+"px";
    document.body.appendChild(fly);
    fly.style.left=fromRect.left+"px"; fly.style.top=fromRect.top+"px";
    fly.style.transform="scale("+(fromRect.width/toRect.width)+")";
    // force reflow
    fly.getBoundingClientRect();
    fly.style.left=toRect.left+"px"; fly.style.top=toRect.top+"px"; fly.style.transform="scale(1) rotate("+(Math.random()*14-7)+"deg)";
    setTimeout(function(){ fly.remove(); if(cb) cb(); },430);
  }

  // ---------- turn engine ----------
  function startTurn(){
    if(G.over) return;
    G.busy=false; G.justDrew=false; G.pendingPlayDrawn=null;
    $("passBtn").style.display="none";
    renderAll();
    if(G.turn!==0){
      setTimeout(botTurn, 800 + Math.random()*500);
    }
  }

  function dealNextStarter(){
    // if starting card was an action card we forced numbers, so nothing here
  }

  // apply a played card's effect; returns the index whose turn is next
  function applyPlay(playerIdx, card){
    var nxt = nextIndex(playerIdx, G.dir);
    if(card.kind==="reverse"){
      G.dir *= -1;
      nxt = nextIndex(playerIdx, G.dir);
      toast("Reverse!", "#ffd45e"); sfxAction();
      return nxt;
    }
    if(card.kind==="skip"){
      toast("Skip - "+G.players[nxt].name, "#ffd45e"); sfxAction();
      return nextIndex(nxt, G.dir);
    }
    if(card.kind==="draw2"){
      drawTo(nxt,2);
      toast("+2 to "+G.players[nxt].name, "#ff8aa0"); sfxAction();
      flashCount(nxt);
      return nextIndex(nxt, G.dir);
    }
    if(card.kind==="wild4"){
      drawTo(nxt,4);
      toast("+4 to "+G.players[nxt].name, "#ff8aa0"); sfxAction();
      flashCount(nxt);
      return nextIndex(nxt, G.dir);
    }
    // num or wild (color already set by caller)
    return nxt;
  }

  function flashCount(i){
    var el = i===0 ? $("hc-0") : $("hc-"+i);
    if(!el) return;
    el.style.transform="scale(1.4)"; el.style.transition="transform .2s";
    setTimeout(function(){ el.style.transform="scale(1)"; },220);
  }

  function drawTo(i,count){
    for(var n=0;n<count;n++){
      if(G.deck.length===0) reshuffle();
      if(G.deck.length===0) break;
      G.players[i].hand.push(G.deck.pop());
    }
    G.players[i].calledUno=false;
  }
  function reshuffle(){
    if(G.discard.length<=1) return;
    var top=G.discard.pop();
    G.deck = shuffle(G.discard);
    G.discard=[top];
  }

  function finishPlay(playerIdx, card, chosenColor){
    G.discard.push(card);
    if(card.color==="wild"){ G.currentColor = chosenColor || COLORS[Math.floor(Math.random()*4)]; }
    else { G.currentColor = card.color; }
    sfxPlay();

    // win?
    if(G.players[playerIdx].hand.length===0){
      endGame(playerIdx);
      return;
    }
    // uno state for this player
    if(G.players[playerIdx].hand.length===1){
      if(playerIdx===0){
        // human must call uno
        startUnoWindow();
      } else {
        G.players[playerIdx].calledUno = true; // bots always call
        toast(G.players[playerIdx].name+": UNO!", "#ffd45e");
      }
    }
    var next = applyPlay(playerIdx, card);
    G.turn = next;
    startTurn();
  }

  // ---------- human actions ----------
  function humanPlay(idx){
    if(G.busy || G.turn!==0 || G.over) return;
    var card = G.players[0].hand[idx];
    if(!canPlay(card)) return;
    if(G.justDrew && G.pendingPlayDrawn!==null && idx!==G.pendingPlayDrawn) return;
    G.busy=true;
    clearUnoWindow(false);
    $("passBtn").style.display="none";
    $("drawPile").classList.remove("can");

    // animate from card position to discard
    var els = $("myRow").children;
    var fromRect = els[idx] ? els[idx].getBoundingClientRect() : $("myRow").getBoundingClientRect();
    G.players[0].hand.splice(idx,1);
    renderMyHand();

    var doFinish = function(color){
      flyCard(card, fromRect, $("discardPile").querySelector(".card")||$("discardPile"), function(){
        finishPlay(0, card, color);
      });
    };
    if(card.color==="wild"){
      openColorPicker(function(color){ doFinish(color); });
    } else {
      doFinish(null);
    }
  }

  function humanDraw(){
    if(G.busy || G.turn!==0 || G.over) return;
    if(G.justDrew) return; // one draw per turn
    G.busy=true;
    clearUnoWindow(false);
    if(G.deck.length===0) reshuffle();
    if(G.deck.length===0){ // truly empty -> pass
      G.busy=false; passTurn(); return;
    }
    var card = G.deck.pop();
    sfxDraw();
    var dpRect=$("drawPile").getBoundingClientRect();
    G.players[0].hand.push(card);
    flyCard("back", dpRect, $("myRow"), function(){});
    G.justDrew=true;
    G.players[0].calledUno=false;
    $("drawCount").textContent=G.deck.length;
    var lastIdx = G.players[0].hand.length-1;
    if(canPlay(card)){
      G.pendingPlayDrawn = lastIdx;
      G.busy=false;
      renderMyHand();
      $("passBtn").style.display="inline-block";
      $("turnHint").textContent="Play it or pass";
      $("drawPile").classList.remove("can");
    } else {
      // auto pass shortly
      renderMyHand();
      $("turnHint").textContent="No play - passing...";
      setTimeout(function(){ G.busy=false; passTurn(); }, 700);
    }
  }

  function passTurn(){
    if(G.over) return;
    clearUnoWindow(false);
    G.turn = nextIndex(0, G.dir);
    startTurn();
  }

  // ---------- UNO window for human ----------
  function startUnoWindow(){
    var btn=$("unoBtn");
    btn.classList.add("on");
    G.players[0].calledUno=false;
    clearTimeout(G.unoTimer);
    G.unoTimer=setTimeout(function(){
      // forgot to call -> penalty
      if(!G.players[0].calledUno && G.players[0].hand.length===1 && !G.over){
        btn.classList.remove("on");
        drawTo(0,2);
        toast("Forgot UNO! +2", "#ff8aa0");
        flashCount(0);
        renderAll();
      }
    }, 2600);
  }
  function clearUnoWindow(called){
    clearTimeout(G.unoTimer);
    $("unoBtn").classList.remove("on");
    if(called){ G.players[0].calledUno=true; }
  }
  $("unoBtn").addEventListener("click", function(){
    if(G.players[0].hand.length===1){
      clearUnoWindow(true);
      toast("UNO!", "#ffd45e"); sfxAction();
      renderAll();
    }
  });

  // ---------- color picker ----------
  var colorCb=null;
  function openColorPicker(cb){
    colorCb=cb;
    $("colorOverlay").classList.add("on");
  }
  Array.prototype.forEach.call(document.querySelectorAll(".colorpick"), function(b){
    b.addEventListener("click", function(){
      $("colorOverlay").classList.remove("on");
      var c=b.getAttribute("data-color");
      if(colorCb){ var cb=colorCb; colorCb=null; cb(c); }
    });
  });

  // ---------- BOT AI ----------
  function botTurn(){
    if(G.over) return;
    var i=G.turn, pl=G.players[i];
    var valid = pl.hand.map(function(c,idx){return {c:c,idx:idx};}).filter(function(o){return canPlay(o.c);});
    if(valid.length===0){
      // draw one
      if(G.deck.length===0) reshuffle();
      if(G.deck.length===0){ // pass
        G.turn=nextIndex(i,G.dir); startTurn(); return;
      }
      var drawn=G.deck.pop(); sfxDraw();
      pl.hand.push(drawn); pl.calledUno=false;
      flashCount(i); renderAll();
      if(canPlay(drawn) && botWillPlayDrawn(drawn,i)){
        setTimeout(function(){ botCommit(i, pl.hand.length-1); }, 520);
      } else {
        setTimeout(function(){ G.turn=nextIndex(i,G.dir); startTurn(); }, 520);
      }
      return;
    }
    var pick = chooseBotCard(valid, i);
    botCommit(i, pick);
  }

  function botWillPlayDrawn(card,i){
    // easy bots sometimes hold; medium/hard always play if valid
    if(G.diff==="easy") return Math.random()<0.7;
    return true;
  }

  function botCommit(i, idx){
    var pl=G.players[i];
    var card=pl.hand[idx];
    // animate from seat avatar to center
    var fromEl = $("av-"+i);
    var fromRect = fromEl ? fromEl.getBoundingClientRect() : $("discardPile").getBoundingClientRect();
    pl.hand.splice(idx,1);
    renderAll();
    var color=null;
    if(card.color==="wild"){ color=chooseBotColor(pl,i); }
    flyCard(card, fromRect, $("discardPile").querySelector(".card")||$("discardPile"), function(){
      finishPlay(i, card, color);
    });
  }

  function chooseBotColor(pl,i){
    if(G.diff==="easy"){ return COLORS[Math.floor(Math.random()*4)]; }
    var count={red:0,yellow:0,green:0,blue:0};
    pl.hand.forEach(function(c){ if(c.color!=="wild") count[c.color]++; });
    var best="red",bv=-1;
    COLORS.forEach(function(c){ if(count[c]>bv){bv=count[c];best=c;} });
    return best;
  }

  function cardScore(c){ // shedding value: higher = better to dump on hard
    if(c.kind==="wild4") return 50;
    if(c.kind==="wild") return 40;
    if(c.kind==="draw2"||c.kind==="skip"||c.kind==="reverse") return 25;
    return c.value;
  }

  function chooseBotCard(valid, i){
    if(G.diff==="easy"){
      return valid[Math.floor(Math.random()*valid.length)].idx;
    }
    var pl=G.players[i];
    var next=G.players[nextIndex(i,G.dir)];
    var nextLow = next.hand.length<=2;

    // separate types
    var nums=[], actions=[], wilds=[];
    valid.forEach(function(o){
      if(o.c.color==="wild") wilds.push(o);
      else if(o.c.kind==="num") nums.push(o);
      else actions.push(o);
    });

    if(G.diff==="medium"){
      // play numbers first (highest value to shed points), then actions, keep wilds last
      if(nums.length){ nums.sort(function(a,b){return b.c.value-a.c.value;}); return nums[0].idx; }
      if(actions.length){ return actions[0].idx; }
      return wilds[0].idx;
    }

    // HARD
    // 1) if next player is low on cards, hit them with an attack card
    if(nextLow){
      var atk = valid.filter(function(o){return o.c.kind==="draw2"||o.c.kind==="skip"||o.c.kind==="wild4";});
      if(atk.length){
        atk.sort(function(a,b){return cardScore(b.c)-cardScore(a.c);});
        return atk[0].idx;
      }
      var rev = valid.filter(function(o){return o.c.kind==="reverse";});
      if(rev.length) return rev[0].idx;
    }
    // 2) maintain control: prefer the color we hold the most of (among non-wild plays)
    var count={red:0,yellow:0,green:0,blue:0};
    pl.hand.forEach(function(c){ if(c.color!=="wild") count[c.color]++; });
    var nonWild = valid.filter(function(o){return o.c.color!=="wild";});
    if(nonWild.length){
      nonWild.sort(function(a,b){
        var dc = count[b.c.color]-count[a.c.color];
        if(dc!==0) return dc;
        return cardScore(b.c)-cardScore(a.c); // shed heavier cards
      });
      return nonWild[0].idx;
    }
    // 3) only wilds left -> play wild, save wild4 if a plain wild exists
    wilds.sort(function(a,b){ return cardScore(a.c)-cardScore(b.c); }); // wild(40) before wild4(50)
    return wilds[0].idx;
  }

  // ---------- end game ----------
  function endGame(winnerIdx){
    G.over=true;
    clearUnoWindow(false);
    [1,2,3].forEach(function(i){ $("seat-"+i).classList.remove("active"); });
    $("meName").classList.remove("active");
    var won = winnerIdx===0;
    saveStat(won);
    setTimeout(function(){
      $("resCrown").innerHTML = won ? "&#127942;" : "&#129528;";
      var t=$("resTitle");
      t.textContent = won ? "You win!" : G.players[winnerIdx].name+" wins";
      t.className = won ? "win":"lose";
      $("resSub").textContent = won
        ? "You cleared your hand on "+G.diff+" mode."
        : "They emptied their hand first. Run it back?";
      $("resultOverlay").classList.add("on");
      if(won) sfxWin(); else sfxLose();
    }, 500);
  }

  // ---------- stats (localStorage) ----------
  function loadStats(){
    try{ return JSON.parse(localStorage.getItem("colorRushStats")||"{}"); }catch(e){ return {}; }
  }
  function saveStat(won){
    var s=loadStats();
    s[G.diff] = s[G.diff] || {w:0,l:0};
    if(won) s[G.diff].w++; else s[G.diff].l++;
    try{ localStorage.setItem("colorRushStats", JSON.stringify(s)); }catch(e){}
    showHomeStats();
  }
  function showHomeStats(){
    var s=loadStats();
    var total=0,wins=0;
    ["easy","medium","hard"].forEach(function(d){ if(s[d]){ total+=s[d].w+s[d].l; wins+=s[d].w; } });
    if(total===0){ $("homeStats").innerHTML="No games yet - your record shows up here."; return; }
    var parts=[];
    ["easy","medium","hard"].forEach(function(d){ if(s[d]){ parts.push(d+": <b>"+s[d].w+"W</b>/"+s[d].l+"L"); } });
    $("homeStats").innerHTML = "Wins: <b>"+wins+"</b> of "+total+" &nbsp; &middot; &nbsp; "+parts.join(" &nbsp; ");
  }

  // ---------- screen flow ----------
  var chosenDiff="medium";
  function showScreen(id){
    document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("on"); });
    $(id).classList.add("on");
  }
  function beginGame(){
    newGame(chosenDiff);
    $("diffPill").textContent = chosenDiff.charAt(0).toUpperCase()+chosenDiff.slice(1);
    $("resultOverlay").classList.remove("on");
    showScreen("game");
    // direction pill updates each render via renderAll? add small updater
    var origRender = renderAll;
    startTurn();
    updateDirPill();
  }
  function updateDirPill(){
    var cw = G.dir===1;
    $("dirArrow").innerHTML = cw ? "&#8635;" : "&#8634;";
    $("dirText").textContent = cw ? "clockwise":"reverse";
  }

  // hook dir pill into renderAll
  var _renderAll = renderAll;
  renderAll = function(){ _renderAll(); if(G && !G.over) updateDirPill(); };

  // ---------- wire up ----------
  document.querySelectorAll(".diff").forEach(function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll(".diff").forEach(function(x){x.classList.remove("sel");});
      b.classList.add("sel");
      chosenDiff=b.getAttribute("data-diff");
    });
  });
  $("startBtn").addEventListener("click", function(){ try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} beginGame(); });
  $("drawPile").addEventListener("click", humanDraw);
  $("passBtn").addEventListener("click", function(){ if(G.turn===0 && !G.busy && !G.over){ G.busy=true; passTurn(); } });
  $("againBtn").addEventListener("click", beginGame);
  $("menuBtn").addEventListener("click", function(){ $("resultOverlay").classList.remove("on"); showScreen("home"); showHomeStats(); });
  $("quitBtn").addEventListener("click", function(){ if(G) G.over=true; clearUnoWindow(false); showScreen("home"); showHomeStats(); });
  $("soundBtn").addEventListener("click", function(){
    soundOn=!soundOn;
    $("soundBtn").innerHTML = soundOn ? "&#9834;" : "&#128263;";
    $("soundBtn").style.opacity = soundOn ? "1":".5";
  });

  // decorative spread on home
  (function(){
    var demo=[{color:"red",kind:"num",value:7},{color:"yellow",kind:"skip"},{color:"green",kind:"num",value:4},{color:"wild",kind:"wild"},{color:"blue",kind:"draw2"}];
    var html="";
    demo.forEach(function(c,i){
      html+='<div style="margin-left:'+(i?-26:0)+'px;transform:rotate('+(i*7-14)+'deg) translateY('+Math.abs(i-2)*4+'px)">'+cardHTML(c,{cls:"sm"})+'</div>';
    });
    $("deckSpread").innerHTML=html;
  })();

  showHomeStats();
})();
</script>
</body>
</html>
