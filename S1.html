<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snap - English in Real Life</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&amp;family=DM+Serif+Display&amp;display=swap" rel="stylesheet">
<style>
:root{
  --teal:#0d7377;
  --teal-dark:#0a5a5d;
  --gold:#d4a017;
  --gold-light:#f4c430;
  --cream:#fdf6e3;
  --ink:#1a2e2f;
  --paper:#fffdf7;
  --soft:#eef5f5;
  --green:#2d8659;
  --green-bright:#3ddc84;
  --red:#c0392b;
  --warn:#e8b923;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Sora',sans-serif;
  background:radial-gradient(ellipse at top,#fdf6e3 0%,#eef5f5 60%,#dde9e9 100%);
  color:var(--ink);
  min-height:100vh;
  padding:14px;
  overflow-x:hidden;
}
.wrap{max-width:580px;margin:0 auto}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;
  margin-bottom:8px;
}
.brand{
  font-family:'DM Serif Display',serif;
  font-size:18px;color:var(--teal);
}
.brand span{color:var(--gold)}
.progress-wrap{flex:1}
.progress{
  height:5px;background:rgba(13,115,119,.15);
  border-radius:99px;overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--teal),var(--gold));
  transition:width .4s ease;
  width:0%;
}
.streak{
  background:var(--paper);
  padding:5px 12px;border-radius:99px;
  font-size:13px;font-weight:700;
  color:var(--gold);
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  min-width:38px;text-align:center;
}

/* ---------- Tabs ---------- */
.tabs{
  display:flex;gap:4px;
  margin-bottom:10px;
  overflow-x:auto;
  padding:4px 2px 8px;
  scrollbar-width:thin;
}
.tabs::-webkit-scrollbar{height:4px}
.tabs::-webkit-scrollbar-thumb{background:rgba(13,115,119,.25);border-radius:99px}
.tab{
  flex-shrink:0;
  background:var(--paper);
  border:1.5px solid rgba(13,115,119,.15);
  padding:7px 12px;
  border-radius:99px;
  font-family:'Sora',sans-serif;
  font-size:11px;font-weight:600;
  color:#666;cursor:pointer;
  transition:all .15s;
  letter-spacing:.3px;
  white-space:nowrap;
}
.tab:hover{border-color:var(--teal);color:var(--teal)}
.tab.active{
  background:linear-gradient(135deg,var(--teal),var(--teal-dark));
  color:var(--paper);
  border-color:var(--teal);
  box-shadow:0 3px 10px rgba(13,115,119,.25);
}
.tab .tab-num{
  background:rgba(255,255,255,.2);
  padding:1px 6px;border-radius:99px;
  font-size:9px;margin-right:4px;font-weight:700;
}
.tab:not(.active) .tab-num{background:var(--soft);color:var(--teal)}
.tab .tab-done{
  display:inline-block;width:6px;height:6px;
  border-radius:50%;
  background:var(--gold);
  margin-left:6px;
  vertical-align:middle;
  opacity:0;
  transition:opacity .25s;
}
.tab.has-progress .tab-done{opacity:1}

/* ---------- Audio bar ---------- */
.audio-bar{
  display:flex;align-items:center;gap:6px;
  margin-bottom:12px;
  background:var(--paper);
  padding:6px 10px;
  border-radius:99px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  font-size:12px;
}
.mode-toggle{
  display:flex;background:var(--soft);
  border-radius:99px;padding:2px;gap:2px;
}
.mode-btn{
  border:none;background:transparent;
  padding:5px 12px;border-radius:99px;
  font-family:'Sora',sans-serif;font-size:11px;
  font-weight:600;color:#666;cursor:pointer;
  letter-spacing:.5px;text-transform:uppercase;
}
.mode-btn.active{
  background:var(--teal);color:var(--paper);
  box-shadow:0 2px 6px rgba(13,115,119,.3);
}
.audio-bar .spacer{flex:1}
.icon-btn{
  background:transparent;
  border:1.5px solid var(--soft);
  width:30px;height:30px;
  border-radius:50%;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--teal);
  font-weight:700;font-size:12px;
  transition:all .15s;
  padding:0;
}
.icon-btn:hover{background:var(--soft);border-color:var(--teal)}
.icon-btn.on{background:var(--teal);color:var(--paper);border-color:var(--teal)}
.icon-btn.speaking{
  background:var(--gold);color:var(--ink);border-color:var(--gold);
  animation:pulse 1s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(212,160,23,.6)}
  50%{box-shadow:0 0 0 8px rgba(212,160,23,0)}
}
.q-dot{
  width:10px;height:10px;border-radius:50%;
  background:#bbb;transition:background .25s;
  flex-shrink:0;margin-left:-2px;margin-right:2px;
}
.q-dot.google{background:var(--green-bright);box-shadow:0 0 6px rgba(61,220,132,.7)}
.q-dot.fallback{background:var(--warn)}
.speed-btn{
  background:transparent;border:1.5px solid var(--soft);
  border-radius:99px;padding:5px 10px;
  font-family:'Sora',sans-serif;font-weight:700;font-size:11px;
  color:var(--teal);cursor:pointer;min-width:38px;
}
.speed-btn:hover{background:var(--soft)}

/* ---------- Settings popover ---------- */
.settings-wrap{position:relative}
.popover{
  position:absolute;top:calc(100% + 8px);right:0;
  background:var(--paper);border-radius:14px;padding:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.15);
  width:280px;z-index:50;display:none;
}
.popover.open{display:block;animation:rise .2s ease}
.popover h4{
  font-family:'DM Serif Display',serif;
  color:var(--teal);font-size:14px;margin-bottom:8px;
  display:flex;align-items:center;gap:8px;
}
.popover h4 .legend-dot{
  width:8px;height:8px;border-radius:50%;display:inline-block;
}
.popover select{
  width:100%;padding:8px 10px;
  border:1.5px solid var(--soft);border-radius:8px;
  font-family:'Sora',sans-serif;font-size:12px;
  background:var(--paper);color:var(--ink);cursor:pointer;
}
.legend{display:flex;gap:14px;margin-top:10px;font-size:10px;color:#777}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block;font-style:normal}
.legend .g{background:var(--green-bright)}
.legend .y{background:var(--warn)}
.popover .hint{font-size:10px;color:#888;margin-top:6px;line-height:1.4}

/* ---------- Stage with side arrows ---------- */
.stage-wrap{
  position:relative;display:flex;align-items:stretch;gap:6px;
}
.flip-btn{
  flex-shrink:0;width:36px;
  background:rgba(255,253,247,.7);
  border:1.5px solid rgba(13,115,119,.15);
  border-radius:14px;color:var(--teal);
  font-size:20px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;align-self:center;height:80px;
}
.flip-btn:hover:not(:disabled){
  background:var(--paper);border-color:var(--teal);
  transform:scale(1.06);box-shadow:0 4px 12px rgba(13,115,119,.15);
}
.flip-btn:disabled{opacity:.25;cursor:default}
.stage{flex:1;min-width:0;position:relative}

.swipe-hint{
  position:absolute;bottom:-22px;left:50%;
  transform:translateX(-50%);
  font-size:10px;color:#999;
  letter-spacing:1px;text-transform:uppercase;
  pointer-events:none;
  animation:hintFade 4s ease forwards;
  white-space:nowrap;
}
@keyframes hintFade{
  0%{opacity:0}15%{opacity:.7}70%{opacity:.7}100%{opacity:0}
}

/* ---------- Moment card ---------- */
.moment{
  background:var(--paper);
  border-radius:18px;overflow:hidden;
  box-shadow:0 6px 24px rgba(13,115,119,.12);
  animation:rise .3s ease;
}
@keyframes rise{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}
.tag{
  padding:8px 16px;
  background:linear-gradient(90deg,var(--teal),var(--teal-dark));
  color:var(--paper);font-size:10px;
  letter-spacing:2px;text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center;
}
.tag .where{opacity:.85}
.tag .scene-num{
  background:rgba(255,255,255,.2);
  padding:2px 8px;border-radius:99px;
  font-weight:600;font-size:9px;letter-spacing:1px;
}
.tag .again{
  background:var(--gold);color:var(--ink);
  padding:2px 8px;border-radius:99px;
  font-weight:700;font-size:9px;
}
.tag .meta{display:flex;gap:6px;align-items:center}

.body{padding:22px 18px 18px}

.listen-pad{
  background:linear-gradient(135deg,var(--teal),var(--teal-dark));
  color:var(--paper);border-radius:14px;
  padding:30px 20px;text-align:center;margin-bottom:6px;
}
.listen-pad .ear{
  font-family:'DM Serif Display',serif;
  font-size:36px;margin-bottom:8px;
}
.listen-pad p{font-size:13px;opacity:.85;margin-bottom:14px}
.big-replay{
  background:var(--gold);color:var(--ink);border:none;
  padding:12px 28px;border-radius:99px;
  font-family:'Sora',sans-serif;font-weight:700;font-size:14px;
  cursor:pointer;display:inline-flex;align-items:center;gap:8px;
}
.big-replay:hover{background:var(--gold-light)}
.big-replay.speaking{animation:pulse 1s ease-in-out infinite}

.bubble{
  background:var(--soft);
  padding:12px 16px;border-radius:16px;
  border-top-left-radius:4px;margin-bottom:8px;
  font-size:16px;line-height:1.45;max-width:88%;
  position:relative;transition:all .25s;
}
.bubble.right{
  background:linear-gradient(135deg,var(--cream),#fdecc7);
  border-top-left-radius:16px;border-top-right-radius:4px;
  margin-left:auto;
}
.bubble.now-playing{box-shadow:0 0 0 3px var(--gold);transform:scale(1.02)}
.who{
  font-size:11px;font-weight:700;color:var(--teal);
  letter-spacing:1px;text-transform:uppercase;
  margin-bottom:3px;padding-left:6px;
}
.who.right{color:var(--gold);text-align:right;padding-right:6px;padding-left:0}

.narration{
  font-size:17px;line-height:1.5;color:#333;
  padding:6px 4px 2px;font-style:italic;
  transition:all .25s;
}
.narration::before{
  content:"";display:inline-block;
  width:3px;height:18px;background:var(--gold);
  margin-right:10px;vertical-align:middle;border-radius:2px;
}
.narration.now-playing{
  background:rgba(212,160,23,.1);
  border-radius:10px;padding:10px 14px;
}

.target{
  background:linear-gradient(180deg,transparent 55%,var(--gold-light) 55%);
  font-weight:700;color:var(--ink);padding:0 3px;
}
.slang{color:var(--teal);font-weight:700}

.q{
  margin-top:16px;font-size:13px;color:#666;
  font-weight:500;padding-left:4px;
}
.q b{color:var(--teal);font-weight:700}

.options{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.option{
  background:var(--paper);
  border:1.5px solid rgba(13,115,119,.2);
  padding:9px 14px;border-radius:99px;
  font-family:'Sora',sans-serif;font-size:14px;
  font-weight:500;cursor:pointer;transition:all .15s;
  color:var(--ink);flex:1 1 auto;text-align:center;
}
.option:hover:not(.locked){
  border-color:var(--teal);background:var(--soft);
  transform:scale(1.02);
}
.option.locked{cursor:default}
.option.right{
  border-color:var(--green);background:#e8f5ee;
  color:var(--green);font-weight:700;
}
.option.wrong{
  border-color:var(--red);background:#fdecea;
  color:var(--red);opacity:.7;
}
.options.full .option{
  flex:1 1 100%;border-radius:12px;
  text-align:left;padding:11px 14px;
}

.fb{
  margin-top:12px;padding:8px 14px;border-radius:10px;
  font-size:13px;font-weight:500;display:none;text-align:center;
}
.fb.show{display:block;animation:rise .25s}
.fb.right{background:#e8f5ee;color:var(--green)}
.fb.wrong{background:#fdecea;color:var(--red)}

.reveal{
  margin-top:10px;background:var(--soft);
  border-radius:10px;padding:10px 14px;
  font-size:13px;color:#555;display:none;
  border-left:3px solid var(--teal);
}
.reveal.show{display:block;animation:rise .25s}
.reveal b{color:var(--teal)}

/* Final */
.final{
  background:linear-gradient(135deg,var(--teal),var(--teal-dark));
  color:var(--paper);padding:36px 22px;text-align:center;
  border-radius:20px;box-shadow:0 12px 32px rgba(13,115,119,.25);
}
.final-score{
  font-family:'DM Serif Display',serif;
  font-size:64px;color:var(--gold-light);
  line-height:1;margin-bottom:4px;
}
.final h2{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:6px}
.final p{opacity:.85;font-size:13px;margin-bottom:18px}
.met{
  background:rgba(255,255,255,.1);
  border-radius:14px;padding:14px;margin:14px 0;
  display:grid;gap:6px;
}
.met-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:5px 4px;font-size:14px;
}
.met-item .name{font-weight:600}
.met-item .count{
  background:var(--gold);color:var(--ink);
  padding:2px 9px;border-radius:99px;
  font-size:11px;font-weight:700;
}
.btn-restart{
  background:var(--gold);color:var(--ink);
  border:none;padding:11px 26px;border-radius:99px;
  font-weight:700;font-family:'Sora',sans-serif;
  font-size:13px;cursor:pointer;margin-top:6px;
}

@media (max-width:420px){
  .bubble,.narration{font-size:15px}
  .option{font-size:13px;padding:8px 12px}
  .mode-btn{font-size:10px;padding:4px 9px}
  .flip-btn{width:28px;font-size:18px}
  .tab{padding:6px 10px;font-size:10px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">En<span>ish</span></div>
    <div class="progress-wrap">
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="streak" id="streakBox">0</div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="audio-bar">
    <div class="mode-toggle">
      <button class="mode-btn active" id="modeRead" data-mode="read">Read</button>
      <button class="mode-btn" id="modeListen" data-mode="listen">Listen</button>
    </div>
    <div class="spacer"></div>
    
    <button class="icon-btn" id="btnReplay" title="Replay">&#9654;</button>
    <span class="q-dot" id="qDot" title="Voice quality"></span>
    <button class="speed-btn" id="btnSpeed" title="Speed">1.0x</button>
    <div class="settings-wrap">
      <button class="icon-btn" id="btnSettings" title="Voice">V</button>
      <div class="popover" id="popover">
        <h4>Voice <span class="legend-dot" id="legendDot"></span></h4>
        <select id="voiceSelect"></select>
        <div class="legend">
          <span><i class="g"></i> Google (best)</span>
          <span><i class="y"></i> Other (ok)</span>
        </div>
        <div class="hint">Google voices sound the most natural. The dot beside the play button shows which kind you're using.</div>
      </div>
    </div>
  </div>

  <div class="stage-wrap">
    <button class="flip-btn" id="flipPrev" title="Previous">&lsaquo;</button>
    <div class="stage" id="stage"></div>
    <button class="flip-btn" id="flipNext" title="Next">&rsaquo;</button>
  </div>

  <div class="swipe-hint" id="swipeHint">tap arrows or swipe to flip freely</div>

</div>

<script>
/* ============================================================
   ABBREVIATION MAP for TTS expansion
   ============================================================ */
const ABBR_MAP = {
  "u":"you","ur":"your","r":"are","pls":"please","plz":"please",
  "thx":"thanks","ty":"thank you","btw":"by the way",
  "idk":"I don't know","imo":"in my opinion","tbh":"to be honest",
  "lol":"laugh out loud","omg":"oh my god","fyi":"for your information",
  "asap":"as soon as possible","brb":"be right back",
  "tmrw":"tomorrow","ttyl":"talk to you later",
  "rn":"right now","ily":"I love you","np":"no problem",
  "yep":"yep","nah":"nah","srsly":"seriously",
  "wanna":"want to","gonna":"going to","gotta":"got to",
  "kinda":"kind of","sorta":"sort of","lemme":"let me",
  "gimme":"give me","dunno":"don't know","ya":"you",
  "cuz":"because","cause":"because","k":"okay","ok":"okay"
};
function expandForTTS(s){
  let t = s.replace(/<[^>]+>/g,'');
  t = t.replace(/\b([A-Za-z']+)\b/g,(m)=>{
    const key = m.toLowerCase();
    return ABBR_MAP.hasOwnProperty(key) ? ABBR_MAP[key] : m;
  });
  return t;
}

/* ============================================================
   DECK 1 - PHRASAL VERBS I (the demo)
   keep on, watch out, figure out, give up, hang in there, piece of cake
   ============================================================ */
const DECK_1 = [
  { type:"LINE", where:"track",
    text:"Coach yells: \"<span class='target'>Keep on</span> running! <span class='slang'>2</span> laps left, <span class='slang'>c'mon</span>!\"",
    tts:[{text:"Coach yells. Keep on running! Two laps left, come on!"}],
    target:"keep on",
    q:"<b>Keep on</b> means...",
    opts:[{t:"continue",r:true},{t:"stop",r:false},{t:"hurry",r:false}],
    fbR:"Yes - continue.",fbW:"It means continue."
  },
  { type:"CHAT", where:"street",
    lines:[
      {who:"Salem",side:"left",t:"<span class='target'>WATCH OUT!!</span> Car!!"},
      {who:"brother",side:"right",t:"<span class='slang'>omg</span> <span class='slang'>thx</span> bro"}
    ],
    tts:[{who:"Salem",text:"Watch out! Car!"},{who:"brother",text:"Oh my god, thanks bro!"}],
    target:"watch out",
    q:"<b>Watch out</b> means...",
    opts:[{t:"look at me",r:false},{t:"be careful",r:true},{t:"run away",r:false}],
    fbR:"Right - it is a warning.",fbW:"It is a warning: be careful."
  },
  { type:"CHAT", where:"WhatsApp after exam",
    lines:[
      {who:"Khalid",side:"left",t:"how was it?? <span class='slang'>srsly</span>"},
      {who:"Faisal",side:"right",t:"<span class='target'>piece of cake</span> <span class='slang'>tbh</span>. done in 20 min <span class='slang'>lol</span>"}
    ],
    tts:[{who:"Khalid",text:"How was it? Seriously."},{who:"Faisal",text:"Piece of cake, to be honest. Done in twenty minutes."}],
    target:"piece of cake",
    q:"For Faisal the test was...",
    opts:[{t:"very hard",r:false},{t:"very easy",r:true},{t:"about food",r:false}],
    fbR:"Yes - very easy.",fbW:"Done in 20 min? Easy."
  },
  { type:"LINE", where:"1am, lamp on",
    text:"Eyes heavy. Majed mumbles: \"<span class='slang'>gonna</span> <span class='target'>keep on</span> reading till I get this.\"",
    tts:[{text:"Eyes heavy. Majed mumbles. Going to keep on reading till I get this."}],
    target:"keep on",
    q:"Same words, new scene. He will...",
    opts:[{t:"go to sleep",r:false},{t:"continue reading",r:true},{t:"close the book",r:false}],
    fbR:"Yes - same meaning as the track scene.",fbW:"Same as the coach. Continue."
  },
  { type:"CHAT", where:"climbing",
    lines:[
      {who:"Yousef",side:"left",t:"my legs <span class='slang'>omg</span>... I <span class='target'>give up</span>"},
      {who:"Omar",side:"right",t:"<span class='target'>hang in there</span> bro! top is RIGHT there <span class='slang'>pls</span>"}
    ],
    tts:[{who:"Yousef",text:"My legs, oh my god. I give up."},{who:"Omar",text:"Hang in there bro! Top is right there, please."}],
    target:"give up",
    q:"<b>Give up</b> means...",
    opts:[{t:"keep walking",r:false},{t:"quit, stop trying",r:true},{t:"give a gift",r:false}],
    fbR:"Yes - quit. And 'hang in there' = stay strong.",
    fbW:"He is exhausted. He wants to quit.",
    bonus:"hang in there"
  },
  { type:"YOU", where:"text from your cousin",
    text:"\"big test <span class='slang'>tmrw</span>, <span class='slang'>idk</span> if I can do it, <span class='slang'>wanna</span> stop <span class='slang'>tbh</span>\"",
    tts:[{text:"Big test tomorrow. I don't know if I can do it. Want to stop, to be honest."}],
    target:"hang in there",
    q:"You reply:",
    opts:[
      {t:"piece of cake bro lol",r:false},
      {t:"hang in there, just 1 more day. u got this",r:true},
      {t:"watch out!!",r:false}
    ],
    fbR:"Perfect reply.",fbW:"He needs courage - 'hang in there'."
  },
  { type:"LINE", where:"kitchen",
    text:"Dad pokes the new coffee machine: \"can't <span class='target'>figure out</span> this thing, <span class='slang'>srsly</span>...\"",
    tts:[{text:"Dad pokes the new coffee machine. Can't figure out this thing, seriously."}],
    target:"figure out",
    q:"He cannot...",
    opts:[{t:"find the coffee",r:false},{t:"understand it",r:true},{t:"buy it",r:false}],
    fbR:"Right - cannot understand how it works.",fbW:"He is confused - he cannot understand it."
  },
  { type:"CHAT", where:"football match",
    lines:[
      {who:"coach",side:"left",t:"Sami, <span class='target'>watch out</span> for No. 7's left foot, <span class='slang'>k</span>?"},

/* ============================================================
   TTS ENGINE
   Voice is resolved at speak-time via Promise (not at page load).
   This matches the approach in a10.html which is stable across devices.
   ============================================================ */

/* Pick best English voice from a list.
   Priority: Google US > any Google en > Samantha (iOS) > Microsoft en-US > en-US > en-* */
function pickBestEnglish(voices){
  if(!voices || !voices.length) return null;
  const prefs = [
    v => /Google US English/i.test(v.name),
    v => /google/i.test(v.name) && /en[-_]/i.test(v.lang),
    v => /Samantha/i.test(v.name) && /en[-_]/i.test(v.lang),
    v => /Microsoft/i.test(v.name) && /en-US/i.test(v.lang),
    v => /en-US/i.test(v.lang),
    v => /en[-_]/i.test(v.lang)
  ];
  for(const pref of prefs){
    const match = voices.find(pref);
    if(match) return match;
  }
  return voices[0];
}

/* Returns a Promise that resolves with the best voice.
   Polls every 100ms (up to 2s) so it works on iOS Safari and slow Androids
   that return [] on the first getVoices() call. */
function getEnglishVoice(){
  if(!window.speechSynthesis) return Promise.resolve(null);
  return new Promise(resolve => {
    const immediate = speechSynthesis.getVoices();
    if(immediate && immediate.length > 0){ resolve(pickBestEnglish(immediate)); return; }
    let resolved = false;
    let tries = 0;
    function done(){
      if(resolved) return;
      resolved = true;
      resolve(pickBestEnglish(speechSynthesis.getVoices()));
    }
    speechSynthesis.onvoiceschanged = done;
    const poll = setInterval(() => {
      tries++;
      const v = speechSynthesis.getVoices();
      if(v && v.length > 0){ clearInterval(poll); done(); }
      else if(tries > 20){ clearInterval(poll); done(); }
    }, 100);
  });
}

function isGoogleVoice(v){ return v && /google/i.test(v.name); }

function updateQualityDot(voice){
  const isG = isGoogleVoice(voice);
  const dot = document.getElementById('qDot');
  if(dot){
    dot.classList.remove('google','fallback');
    dot.classList.add(isG ? 'google' : 'fallback');
    dot.title = isG ? 'Google TTS - best quality' : 'Standard voice';
  }
  const legend = document.getElementById('legendDot');
  if(legend) legend.style.background = isG ? 'var(--green-bright)' : 'var(--warn)';
}

/* Populate the voice selector. Called when user opens the V popover. */
function populateVoiceSelector(sel, currentVoice){
  const voices = speechSynthesis.getVoices();
  const en = voices.filter(v => /^en[-_]/i.test(v.lang) || v.lang.toLowerCase().startsWith('en'));
  const list = en.length ? en : voices;
  list.sort((a,b) => {
    const rank = v => {
      if(/google/i.test(v.name)) return 3;
      if(/microsoft/i.test(v.name)) return 2;
      return 1;
    };
    return rank(b) - rank(a);
  });
  sel.innerHTML = '';
  list.forEach((v,i) => {
    const opt = document.createElement('option');
    opt.value = i;
    const n = v.name.toLowerCase();
    let prefix = n.includes('google') ? '[Google] ' : n.includes('microsoft') ? '[MS] ' : '';
    opt.textContent = prefix + v.name + ' (' + v.lang + ')';
    if(currentVoice && v.name === currentVoice.name) opt.selected = true;
    sel.appendChild(opt);
  });
  sel._list = list;
}

/* Core TTS object - minimal, no eager loading */
const TTS = {
  speed: 1.0,
  manualVoice: null,   /* set when user picks from the selector */

  /* Speak a sequence of items [{text, who}] sequentially.
     Voice is resolved fresh each call if not manually overridden. */
  speak(items, opts){
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    opts = opts || {};
    const onItemStart = opts.onItemStart || function(){};
    const onItemEnd   = opts.onItemEnd   || function(){};
    const onAllDone   = opts.onAllDone   || function(){};

    const voicePromise = this.manualVoice
      ? Promise.resolve(this.manualVoice)
      : getEnglishVoice();

    voicePromise.then(voice => {
      updateQualityDot(voice);
      let i = 0;
      const playNext = () => {
        if(i >= items.length){ onAllDone(); return; }
        const item = items[i];
        const spoken = expandForTTS(item.text);
        const u = new SpeechSynthesisUtterance(spoken);
        if(voice) u.voice = voice;
        u.rate = TTS.speed;
        u.pitch = 1.0;
        u.lang = (voice && voice.lang) || 'en-US';
        u.onstart = () => onItemStart(i, item);
        u.onend   = () => { onItemEnd(i, item); i++; setTimeout(playNext, 220); };
        u.onerror = () => { i++; setTimeout(playNext, 220); };
        speechSynthesis.speak(u);
      };
      playNext();
    });
  },

  stop(){ if(window.speechSynthesis) speechSynthesis.cancel(); }
};

/* Tabs */
function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  DECKS.forEach((d,i)=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (i===currentDeck ? ' active' : '');
    if(DECK_STATE[i].answered.size > 0) btn.classList.add('has-progress');
    btn.innerHTML = `<span class="tab-num">${i+1}</span>${d.short}<span class="tab-done"></span>`;
    btn.addEventListener('click',()=>switchDeck(i));
    tabsEl.appendChild(btn);
  });
}
function switchDeck(i){
  TTS.stop();
  currentDeck = i;
  renderTabs();
  render();
}

/* Audio bar wiring */
const btnReplay = document.getElementById('btnReplay');
const btnSpeed = document.getElementById('btnSpeed');
const btnSettings = document.getElementById('btnSettings');
const popover = document.getElementById('popover');

const flipPrev = document.getElementById('flipPrev');
const flipNext = document.getElementById('flipNext');

btnReplay.addEventListener('click',()=>{ playCurrentMoment(); });

const speeds = [0.8,1.0,1.2];
let speedIdx = 1;
btnSpeed.addEventListener('click',()=>{
  speedIdx = (speedIdx+1) % speeds.length;
  TTS.speed = speeds[speedIdx];
  btnSpeed.textContent = TTS.speed.toFixed(1)+'x';
});

btnSettings.addEventListener('click',(e)=>{
  e.stopPropagation();
  popover.classList.toggle('open');
  if(popover.classList.contains('open')){
    getEnglishVoice().then(voice => {
      populateVoiceSelector(voiceSelect, TTS.manualVoice || voice);
      updateQualityDot(TTS.manualVoice || voice);
    });
  }
});
document.addEventListener('click',(e)=>{
  if(!popover.contains(e.target) && e.target !== btnSettings){
    popover.classList.remove('open');
  }
});
voiceSelect.addEventListener('change',()=>{
  if(voiceSelect._list){
    TTS.manualVoice = voiceSelect._list[parseInt(voiceSelect.value)];
    updateQualityDot(TTS.manualVoice);
  }
});

let mode = 'read';
document.querySelectorAll('.mode-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    mode = b.dataset.mode;
    render();

/* Navigation */
function goPrev(){
  const st = getState();
  if(st.idx > 0){ st.idx--; render(); }
}
function goNext(){
  const st = getState();
  if(st.idx < getDeck().length){ st.idx++; render(); }
}
flipPrev.addEventListener('click', goPrev);
flipNext.addEventListener('click', goNext);

document.addEventListener('keydown',(e)=>{
  if(e.target.tagName === 'SELECT') return;
  if(e.key === 'ArrowLeft') goPrev();
  else if(e.key === 'ArrowRight') goNext();
});

let touchStartX=0, touchStartY=0;
stage.addEventListener('touchstart',(e)=>{
  if(e.touches.length === 1){
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
},{passive:true});
stage.addEventListener('touchend',(e)=>{
  if(e.changedTouches.length !== 1) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.5){
    if(dx > 0) goPrev(); else goNext();
  }
},{passive:true});

  const bubbles = stage.querySelectorAll('.bubble');

  if(bubbles.length > 0){
    bubbles.forEach(b => b.classList.remove('now-playing'));
    if(on && bubbles[i]) bubbles[i].classList.add('now-playing');
  } else if(narration){
    narration.classList.toggle('now-playing', on);
  }
}
function playCurrentMoment(){
  const st = getState();
  const deck = getDeck();
  const m = deck[st.idx];
  if(!m || !m.tts) return;
  setSpeaking(true);
  TTS.speak(m.tts, {
    onItemStart:(i)=>highlightItem(i,true),
    onItemEnd:(i)=>highlightItem(i,false),
    onAllDone:()=>setSpeaking(false)
  });
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  TTS.stop();
  setSpeaking(false);

  const deck = getDeck();
  const st = getState();
  const total = deck.length;

  document.getElementById('progressFill').style.width = (st.answered.size/total*100)+'%';
  document.getElementById('streakBox').textContent = st.streak;

  flipPrev.disabled = st.idx <= 0;
  flipNext.disabled = st.idx >= total;

  renderTabs();

  if(st.idx >= total){ renderFinal(); return; }

  const m = deck[st.idx];

  if(!st.visited.has(st.idx)){
    if(m.target){
      st.encounters[m.target] = (st.encounters[m.target]||0) + 1;
    }
    if(m.bonus){
      st.encounters[m.bonus] = (st.encounters[m.bonus]||0) + 1;
    }
    st.visited.add(st.idx);
  }

  const enc = st.encounters[m.target] || 1;
  const againBadge = enc >= 2 ? `<span class="again">again #${enc}</span>` : '';

  let body = '';
  if(mode === 'listen'){
    body = `
      <div class="listen-pad">
        <div class="ear">listen</div>
        <p>Close your eyes. Tap to play again.</p>
        <button class="big-replay" id="bigReplay">&#9654; Play</button>
      </div>
    `;
  } else {
    if(m.type === 'LINE' || m.type === 'YOU'){
      body = `<div class="narration">${m.text}</div>`;
    } else if(m.type === 'CHAT'){
      body = m.lines.map(l=>{
        const sc = l.side==='right' ? 'right' : '';
        return `<div class="who ${sc}">${l.who}</div><div class="bubble ${sc}">${l.t}</div>`;
      }).join('');
    }
  }

  const fullClass = m.type === 'YOU' ? 'full' : '';
  const optsHTML = m.opts.map((o,oi)=>
    `<button class="option" data-r="${o.r?1:0}" data-i="${oi}">${o.t}</button>`
  ).join('');

  let revealHTML = '';
  if(mode === 'listen'){
    let revealText = '';
    if(m.type === 'LINE' || m.type === 'YOU') revealText = m.text;
    else if(m.type === 'CHAT') revealText = m.lines.map(l=>`<b>${l.who}:</b> ${l.t}`).join('<br>');
    revealHTML = `<div class="reveal" id="reveal">${revealText}</div>`;
  }

  stage.innerHTML = `
    <div class="moment">
      <div class="tag">
        <span class="where">${m.where}</span>
        <div class="meta">
          <span class="scene-num">${st.idx+1} / ${total}</span>
          ${againBadge}
        </div>
      </div>
      <div class="body">
        ${body}
        <div class="q">${m.q}</div>
        <div class="options ${fullClass}">${optsHTML}</div>
        <div class="fb" id="fb"></div>
        ${revealHTML}
      </div>
    </div>
  `;

  stage.querySelectorAll('.option').forEach(btn=>{
    btn.addEventListener('click',()=>handleAnswer(btn,m));
  });

  if(st.answered.has(st.idx)){
    const ans = st.answered.get(st.idx);
    const all = stage.querySelectorAll('.option');
    all.forEach(o=>o.classList.add('locked'));
    if(ans.chosen != null){
      const chosenBtn = stage.querySelector(`.option[data-i="${ans.chosen}"]`);
      if(chosenBtn) chosenBtn.classList.add(ans.right ? 'right' : 'wrong');
      if(!ans.right){
        all.forEach(o=>{ if(o.dataset.r==='1') o.classList.add('right'); });
      }
    }
    const fb = document.getElementById('fb');
    fb.textContent = ans.right ? m.fbR : m.fbW;
    fb.classList.add('show', ans.right ? 'right' : 'wrong');
    const reveal = document.getElementById('reveal');
    if(reveal) reveal.classList.add('show');
  }

  const bigReplay = document.getElementById('bigReplay');
  if(bigReplay) bigReplay.addEventListener('click',()=>playCurrentMoment());


}

function handleAnswer(btn,m){
  const st = getState();
  if(st.answered.has(st.idx)) return;

  const all = stage.querySelectorAll('.option');
  all.forEach(o=>o.classList.add('locked'));
  const right = btn.dataset.r === '1';
  const fb = document.getElementById('fb');
  if(right){
    btn.classList.add('right');
    st.streak++; st.score++;
    fb.textContent = m.fbR;
    fb.classList.add('show','right');
  } else {
    btn.classList.add('wrong');
    st.streak = 0;
    all.forEach(o=>{ if(o.dataset.r==='1') o.classList.add('right'); });
    fb.textContent = m.fbW;
    fb.classList.add('show','wrong');
  }
  st.answered.set(st.idx, { right:right, chosen:parseInt(btn.dataset.i) });

  document.getElementById('streakBox').textContent = st.streak;
  document.getElementById('progressFill').style.width = (st.answered.size/getDeck().length*100)+'%';

  const reveal = document.getElementById('reveal');
  if(reveal) reveal.classList.add('show');

  renderTabs();
}

function renderFinal(){
  TTS.stop();
  setSpeaking(false);
  const st = getState();
  const deck = getDeck();
  const total = deck.length;
  document.getElementById('progressFill').style.width = '100%';
  flipPrev.disabled = false;
  flipNext.disabled = true;

  let list = '';
  Object.entries(st.encounters).forEach(([k,v])=>{
    if(v>0) list += `<div class="met-item"><span class="name">${k}</span><span class="count">${v}x</span></div>`;
  });

  const nextDeckIdx = (currentDeck+1) % DECKS.length;
  stage.innerHTML = `
    <div class="final">
      <div class="final-score">${st.score}/${total}</div>
      <h2>Done.</h2>
      <p>You met these in real moments. They stick now.</p>
      <div class="met">${list}</div>
      <button class="btn-restart" id="btnRestartDeck">Replay this deck</button>
      <br><br>
      <button class="btn-restart" id="btnNextDeck" style="background:rgba(255,255,255,.2);color:var(--paper)">
        Next: ${DECKS[nextDeckIdx].name} &rarr;
      </button>
    </div>
  `;
  document.getElementById('btnRestartDeck').addEventListener('click',()=>{
    DECK_STATE[currentDeck] = { idx:0, streak:0, score:0, visited:new Set(), answered:new Map(), encounters:{} };
    render();
  });
  document.getElementById('btnNextDeck').addEventListener('click',()=>{
    switchDeck(nextDeckIdx);
  });
}

/* boot */
renderTabs();
render();
</script>
</body>
</html>
