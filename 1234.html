<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b1f3a; --navy2:#0f2a4d; --panel:#16335c; --panel2:#1d4276; --line:#2b4f86;
    --light:#dbe8fb; --dark:#3f6bb0; --amber:#ffd166; --amber2:#f6b73c; --cyan:#34d1ff;
    --good:#39d98a; --bad:#ff6b6b; --white-pc:#f6f9ff; --black-pc:#0a1830; --ink:#eaf2ff; --muted:#9fb6d8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);min-height:100vh;
    background:radial-gradient(900px 500px at 50% -10%, #1b3e70 0%, transparent 60%), linear-gradient(180deg, var(--navy) 0%, #081729 100%);
    -webkit-tap-highlight-color:transparent;}
  h1,h2,h3{font-family:'Baloo Bhaijaan 2',sans-serif;margin:0;font-weight:700}
  button{font-family:'Baloo Bhaijaan 2',sans-serif;cursor:pointer;border:none}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 36px}
  .hidden{display:none !important}

  /* start */
  .hero{text-align:center;padding:18px 6px 8px}
  .hero .crown{font-size:54px;line-height:1;color:var(--cyan);filter:drop-shadow(0 6px 12px rgba(0,0,0,.45))}
  .hero h1{font-size:38px;color:#fff;margin-top:2px}
  .hero p{color:var(--muted);font-weight:700;margin:6px 0 0}
  .sectitle{font-family:'Baloo Bhaijaan 2';font-weight:700;color:var(--cyan);font-size:18px;margin:20px 4px 10px}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .opt{background:linear-gradient(160deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:18px;padding:16px 8px;text-align:center;transition:transform .1s, border-color .15s, box-shadow .15s}
  .opt:active{transform:scale(.97)}
  .opt.sel{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,209,102,.25)}
  .opt .ic{font-size:30px;line-height:1}
  .opt .nm{font-family:'Baloo Bhaijaan 2';font-weight:700;color:#fff;font-size:19px;margin-top:6px}
  .opt .en{color:var(--muted);font-size:12px;font-weight:700}
  .opts.two{grid-template-columns:repeat(2,1fr)}
  .playbtn{margin-top:24px;width:100%;background:linear-gradient(180deg,var(--amber),var(--amber2));color:#3a2a00;border-radius:16px;padding:16px;font-size:21px;font-weight:700;box-shadow:0 10px 24px rgba(246,183,60,.25)}
  .playbtn:active{transform:scale(.99)}

  /* game */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .back{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:9px 14px;font-size:15px;font-weight:700}
  .back:active{transform:scale(.97)}
  .lvlpill{flex:1;text-align:center;color:var(--muted);font-weight:800;font-family:'Baloo Bhaijaan 2';font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px;font-weight:800}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);flex:none}
  .dot.think{background:var(--amber);box-shadow:0 0 10px var(--amber);animation:pulse 1s infinite}
  .dot.chk{background:var(--bad);box-shadow:0 0 10px var(--bad)}
  @keyframes pulse{50%{opacity:.4}}
  .status .msg{flex:1}
  .status .en{color:var(--cyan);font-family:'Baloo Bhaijaan 2';font-size:14px}

  .tray{display:flex;align-items:center;gap:3px;min-height:30px;padding:3px 8px;background:rgba(0,0,0,.18);border-radius:10px;margin-bottom:6px;flex-wrap:wrap}
  .tray .lab{font-size:11px;color:var(--muted);font-weight:800;margin-left:4px;font-family:'Baloo Bhaijaan 2'}
  .tray .pc{font-size:20px;line-height:1}
  .tray img{width:20px;height:20px;object-fit:contain}

  .frame{background:linear-gradient(160deg,#11305a,#091e39);padding:12px;border-radius:20px;border:1px solid var(--line);box-shadow:0 16px 40px rgba(5,14,30,.6), inset 0 0 0 1px rgba(255,255,255,.03)}
  .board{--sq:min(11vw,56px);direction:ltr;display:grid;grid-template-columns:16px repeat(8,var(--sq));grid-template-rows:repeat(8,var(--sq)) 16px;justify-content:center;user-select:none}
  .sq{position:relative;display:flex;align-items:center;justify-content:center}

  .rlab,.flab{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px;font-weight:800;font-family:'Baloo Bhaijaan 2'}
  .pc{pointer-events:none;font-size:calc(var(--sq) * .74);line-height:1}
  .pc.white{color:var(--white-pc);text-shadow:0 1px 1px #5a6f93, 0 0 2px #000, 0 2px 3px rgba(0,0,0,.35)}
  .pc.black{color:var(--black-pc);text-shadow:0 1px 0 #7088ae, 0 2px 3px rgba(0,0,0,.4)}
  img.pc{width:calc(var(--sq) * .9);height:calc(var(--sq) * .9);object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
  .sq.sel{box-shadow:inset 0 0 0 4px var(--amber)}
  .sq.last{box-shadow:inset 0 0 0 4px rgba(52,209,255,.5)}
  .sq.chk{background:#ff8a8a !important;box-shadow:inset 0 0 0 4px var(--bad)}
  .sq.hint{box-shadow:inset 0 0 0 4px var(--good)}
  .sq .dotmark{position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(20,60,120,.45)}
  .sq.light .dotmark{background:rgba(30,80,150,.4)}
  .sq .ring{position:absolute;inset:7%;border-radius:50%;border:4px solid rgba(20,70,140,.5)}

  .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .ctrl{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:13px;padding:11px 4px;font-size:14px;font-weight:700}
  .ctrl:active{transform:scale(.96)}
  .ctrl.primary{background:linear-gradient(180deg,var(--amber),var(--amber2));color:#3a2a00;border-color:#caa030}

  .scrim{position:fixed;inset:0;background:rgba(5,12,26,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30;backdrop-filter:blur(3px)}
  .modal{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:24px 22px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6)}
  .modal .big{font-size:52px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
  .modal h2{font-size:26px;color:#fff;margin:8px 0 4px}
  .modal p{color:var(--ink);font-weight:700;line-height:1.5;margin:6px 0}
  .modal .go{margin-top:14px;width:100%;background:linear-gradient(180deg,var(--amber),var(--amber2));color:#3a2a00;border-radius:14px;padding:13px;font-size:17px;font-weight:700}
  .modal .ghost{margin-top:8px;width:100%;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:14px;padding:11px;font-size:14px;font-weight:700}
  .promorow{display:flex;gap:10px;justify-content:center;margin-top:12px}
  .promorow button{background:var(--panel);border:2px solid var(--line);border-radius:14px;width:62px;height:62px;display:flex;align-items:center;justify-content:center}
  .promorow button:active{border-color:var(--amber)}
  .promorow .pc{font-size:38px}
  .promorow img{width:46px;height:46px;object-fit:contain}

  .sound{position:fixed;top:10px;left:10px;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:11px;padding:6px 10px;font-size:12px;font-weight:700;z-index:20}
  .confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:40;border-radius:2px;pointer-events:none}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
  @media (max-width:420px){ .hero h1{font-size:32px} .board{--sq:min(10.6vw,48px)} }
</style>
</head>
<body>
<button id="soundBtn" class="sound"></button>

<!-- START -->
<div id="startScreen" class="wrap">
  <div class="hero"><div class="crown">&#9818;&#65038;</div><h1 id="sTitle"></h1><p id="sTag"></p></div>
  <div class="sectitle" id="sLevelT"></div>
  <div class="opts" id="levelOpts"></div>
  <div class="sectitle" id="sSideT"></div>
  <div class="opts two" id="sideOpts"></div>
  <button class="playbtn" id="playBtn"></button>
</div>

<!-- GAME -->
<div id="gameScreen" class="wrap hidden">
  <div class="topbar">
    <button class="back" id="menuBtn"></button>
    <div class="lvlpill" id="lvlPill"></div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span class="msg" id="statusMsg"></span><span class="en" id="statusEn"></span></div>
  <div class="tray" id="trayTop"></div>
  <div class="frame"><div class="board" id="board"></div></div>
  <div class="tray" id="trayBot"></div>
  <div class="controls">
    <button class="ctrl primary" id="hintBtn"></button>
    <button class="ctrl" id="undoBtn"></button>
    <button class="ctrl" id="newBtn"></button>
    <button class="ctrl" id="menu2Btn"></button>
  </div>
</div>

<div id="modalMount"></div>

<script>
"use strict";
/* ===ENGINE START=== */
function inB(r,c){ return r>=0&&r<8&&c>=0&&c<8; }
function cloneState(s){
  var nb=new Array(8);
  for(var r=0;r<8;r++){ var row=s.b[r], nr=new Array(8); for(var c=0;c<8;c++){ var p=row[c]; nr[c]=p?{t:p.t,c:p.c}:null; } nb[r]=nr; }
  return {b:nb, turn:s.turn, cr:{wk:s.cr.wk,wq:s.cr.wq,bk:s.cr.bk,bq:s.cr.bq}, ep:s.ep?[s.ep[0],s.ep[1]]:null, half:s.half, full:s.full};
}
function startState(){
  var b=[]; for(var r=0;r<8;r++){ b.push([null,null,null,null,null,null,null,null]); }
  var back=["R","N","B","Q","K","B","N","R"];
  for(var c=0;c<8;c++){ b[0][c]={t:back[c],c:"b"}; b[1][c]={t:"P",c:"b"}; b[6][c]={t:"P",c:"w"}; b[7][c]={t:back[c],c:"w"}; }
  return {b:b, turn:"w", cr:{wk:true,wq:true,bk:true,bq:true}, ep:null, half:0, full:1};
}
function kingSq(b,color){ for(var r=0;r<8;r++) for(var c=0;c<8;c++){ var p=b[r][c]; if(p&&p.t==="K"&&p.c===color) return [r,c]; } return null; }
function isAttacked(b,r,c,by){
  var pr = by==="w" ? r+1 : r-1, pdc=[-1,1];
  for(var i=0;i<2;i++){ var cc=c+pdc[i]; if(inB(pr,cc)){ var t=b[pr][cc]; if(t&&t.c===by&&t.t==="P") return true; } }
  var js=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
  for(var k=0;k<8;k++){ var nr=r+js[k][0],nc=c+js[k][1]; if(inB(nr,nc)){ var tn=b[nr][nc]; if(tn&&tn.c===by&&tn.t==="N") return true; } }
  for(var dr=-1;dr<=1;dr++) for(var dc=-1;dc<=1;dc++){ if(!dr&&!dc) continue; var kr=r+dr,kc=c+dc; if(inB(kr,kc)){ var tk=b[kr][kc]; if(tk&&tk.c===by&&tk.t==="K") return true; } }
  var orth=[[-1,0],[1,0],[0,-1],[0,1]];
  for(var o=0;o<4;o++){ var sr=r+orth[o][0],sc=c+orth[o][1]; while(inB(sr,sc)){ var ts=b[sr][sc]; if(ts){ if(ts.c===by&&(ts.t==="R"||ts.t==="Q")) return true; break; } sr+=orth[o][0]; sc+=orth[o][1]; } }
  var diag=[[-1,-1],[-1,1],[1,-1],[1,1]];
  for(var g=0;g<4;g++){ var dr2=r+diag[g][0],dc2=c+diag[g][1]; while(inB(dr2,dc2)){ var td=b[dr2][dc2]; if(td){ if(td.c===by&&(td.t==="B"||td.t==="Q")) return true; break; } dr2+=diag[g][0]; dc2+=diag[g][1]; } }
  return false;
}
function genPseudo(s){
  var b=s.b, color=s.turn, opp=color==="w"?"b":"w", moves=[];
  var promoRow = color==="w"?0:7, startRow = color==="w"?6:1, dir = color==="w"?-1:1;
  function addPawn(fr,fc,tr,tc,cap,isEp,dbl){
    if(tr===promoRow){ var P=["Q","R","B","N"]; for(var i=0;i<4;i++) moves.push({from:[fr,fc],to:[tr,tc],t:"P",cap:cap,promo:P[i],ep:false,castle:null,dbl:false}); }
    else moves.push({from:[fr,fc],to:[tr,tc],t:"P",cap:cap,promo:null,ep:!!isEp,castle:null,dbl:!!dbl});
  }
  for(var r=0;r<8;r++) for(var c=0;c<8;c++){
    var p=b[r][c]; if(!p||p.c!==color) continue;
    if(p.t==="P"){
      if(inB(r+dir,c)&&!b[r+dir][c]){ addPawn(r,c,r+dir,c,null,false,false);
        if(r===startRow&&!b[r+2*dir][c]) addPawn(r,c,r+2*dir,c,null,false,true); }
      var dcs=[-1,1];
      for(var d=0;d<2;d++){ var tr=r+dir,tc=c+dcs[d]; if(!inB(tr,tc)) continue;
        var tt=b[tr][tc];
        if(tt&&tt.c===opp) addPawn(r,c,tr,tc,tt.t,false,false);
        else if(s.ep&&s.ep[0]===tr&&s.ep[1]===tc) addPawn(r,c,tr,tc,"P",true,false);
      }
    } else if(p.t==="N"){
      var js=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
      for(var k=0;k<8;k++){ var nr=r+js[k][0],nc=c+js[k][1]; if(!inB(nr,nc)) continue; var q=b[nr][nc]; if(!q||q.c===opp) moves.push({from:[r,c],to:[nr,nc],t:"N",cap:q?q.t:null,promo:null,ep:false,castle:null,dbl:false}); }
    } else if(p.t==="K"){

  easy:{maxDepth:1,noise:130,randomChance:0.22,timeMs:250,ic:"\ud83d\ude0a"},
  medium:{maxDepth:3,noise:25,randomChance:0,timeMs:650,ic:"\ud83d\ude42"},

};
var INIT={P:8,N:2,B:2,R:2,Q:1,K:1};

var G=null, chosenDiff="medium", chosenSide="w";

function $(id){return document.getElementById(id);}
function mkPiece(code,color,type,imgClass,spanClass){
  var src=IMG[code];
  if(src){ var img=document.createElement("img"); img.src=src; if(imgClass) img.className=imgClass; img.alt=""; img.draggable=false; return img; }
  var s=document.createElement("span"); s.className=spanClass; s.textContent=GLYPH[type]; return s;
}
function pieceEl(p){ return mkPiece(p.c+p.t,p.c,p.t,"pc","pc "+(p.c==="w"?"white":"black")); }
function smallPiece(t,color){ return mkPiece(color+t,color,t,"","pc "+(color==="w"?"white":"black")); }
function smallPieceBig(t,color){ return mkPiece(color+t,color,t,"","pc "+(color==="w"?"white":"black")); }

/* sound */
var soundOn=true, actx=null;
function tone(f,d,t){ if(!soundOn) return; try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); var o=actx.createOscillator(),g=actx.createGain(); o.type=t||"sine"; o.frequency.value=f; g.gain.value=0.0001; o.connect(g); g.connect(actx.destination); var n=actx.currentTime; g.gain.exponentialRampToValueAtTime(0.16,n+0.01); g.gain.exponentialRampToValueAtTime(0.0001,n+d); o.start(n); o.stop(n+d);}catch(e){} }
function sMove(){tone(440,0.08,"triangle");} function sCap(){tone(220,0.13,"sawtooth");}
function sWin(){tone(523,0.12);setTimeout(function(){tone(659,0.12);},110);setTimeout(function(){tone(784,0.2);},230);}
function sChk(){tone(330,0.12,"square");}

/* ---- start screen ---- */
function buildStart(){
  $("soundBtn").textContent=T.soundOn;
  $("sTitle").textContent=T.title; $("sTag").textContent=T.tagline;
  $("sLevelT").textContent=T.chooseLevel; $("sSideT").textContent=T.chooseSide;
  $("playBtn").textContent=T.play;
  var L=[["easy",T.easy,"Easy"],["medium",T.medium,"Medium"],["hard",T.hard,"Hard"]];
  var lo=$("levelOpts"); lo.innerHTML="";
  L.forEach(function(d){ var el=document.createElement("div"); el.className="opt"+(d[0]===chosenDiff?" sel":"");
    el.innerHTML='<div class="ic">'+DIFF[d[0]].ic+'</div><div class="nm">'+d[1]+'</div><div class="en">'+d[2]+'</div>';
    el.onclick=function(){ chosenDiff=d[0]; buildStart(); }; lo.appendChild(el); });
  var S=[["w",T.white,"White","\u265f\ufe0e"],["b",T.black,"Black","\u265f\ufe0e"]];
  var so=$("sideOpts"); so.innerHTML="";
  S.forEach(function(d){ var el=document.createElement("div"); el.className="opt"+(d[0]===chosenSide?" sel":"");
    el.innerHTML='<div class="ic"><span class="pc '+(d[0]==="w"?"white":"black")+'" style="font-size:30px">'+d[3]+'</span></div><div class="nm">'+d[1]+'</div><div class="en">'+d[2]+'</div>';
    el.onclick=function(){ chosenSide=d[0]; buildStart(); }; so.appendChild(el); });
}
$("playBtn"); // ensure exists

/* ---- game lifecycle ---- */
function startGame(){
  G={ state:startState(), player:chosenSide, ai:chosenSide==="w"?"b":"w", opt:DIFF[chosenDiff],
      flip:chosenSide==="b", sel:null, legal:[], last:null, history:[], over:false, busy:false };
  $("startScreen").classList.add("hidden"); $("gameScreen").classList.remove("hidden");
  $("hintBtn").textContent=T.hint; $("undoBtn").textContent=T.undo; $("newBtn").textContent=T.newGame;
  $("menuBtn").textContent=T.menu; $("menu2Btn").textContent=T.menu;
  var nm = chosenDiff==="easy"?T.easy:chosenDiff==="medium"?T.medium:T.hard;
  $("lvlPill").textContent=T.levelW+nm;
  window.scrollTo(0,0); render(); status();
  if(G.player==="b"){ setTimeout(aiMove,300); }
}

/* ---- render ---- */
var boardEl=$("board"); var FILES=["a","b","c","d","e","f","g","h"];
function real(visR,visC){ return G.flip?[7-visR,7-visC]:[visR,visC]; }
function render(){
  boardEl.innerHTML="";
  var legalSet={}; for(var i=0;i<G.legal.length;i++) legalSet[G.legal[i].to[0]+","+G.legal[i].to[1]]=true;
  var chkSq=null; var k=kingSq(G.state.b,G.state.turn);
  if(k && isAttacked(G.state.b,k[0],k[1], G.state.turn==="w"?"b":"w")) chkSq=k[0]+","+k[1];
  for(var vr=0;vr<8;vr++){
    var rr=real(vr,0); var rl=document.createElement("div"); rl.className="rlab"; rl.textContent=(8-rr[0]); boardEl.appendChild(rl);
    for(var vc=0;vc<8;vc++){
      var rc=real(vr,vc); var r=rc[0],c=rc[1];
      var sq=document.createElement("div"); sq.className="sq "+(((r+c)%2===0)?"light":"dark"); sq.dataset.r=r; sq.dataset.c=c;
      if(G.last && ((G.last.from[0]===r&&G.last.from[1]===c)||(G.last.to[0]===r&&G.last.to[1]===c))) sq.classList.add("last");
      if(G.sel && G.sel[0]===r&&G.sel[1]===c) sq.classList.add("sel");
      if(chkSq===(r+","+c)) sq.classList.add("chk");
      var p=G.state.b[r][c];
      if(p) sq.appendChild(pieceEl(p));
      if(legalSet[r+","+c]){ var mk=document.createElement("span"); mk.className=p?"ring":"dotmark"; sq.appendChild(mk); }
      boardEl.appendChild(sq);
    }
  }
  var corner=document.createElement("div"); corner.className="flab"; boardEl.appendChild(corner);
  for(var f=0;f<8;f++){ var fc=real(0,f)[1]; var fl=document.createElement("div"); fl.className="flab"; fl.textContent=FILES[fc]; boardEl.appendChild(fl); }
  trays();
}
function trays(){
  var cnt={w:{},b:{}}; for(var r=0;r<8;r++)for(var c=0;c<8;c++){ var p=G.state.b[r][c]; if(p) cnt[p.c][p.t]=(cnt[p.c][p.t]||0)+1; }
  function missing(color){ var out=[]; for(var t in INIT){ var m=INIT[t]-(cnt[color][t]||0); for(var i=0;i<m;i++) out.push(t); } return out; }
  // top tray = pieces captured by the side at the TOP of the board (the opponent of player)
  var topColor = G.player; // player at bottom; top tray shows what player captured (opponent pieces missing)
  var oppOfPlayer = G.player==="w"?"b":"w";
  fillTray($("trayTop"), T.youCap, missing(oppOfPlayer), oppOfPlayer);
  fillTray($("trayBot"), T.compCap, missing(G.player), G.player);
}
function fillTray(el,label,arr,color){
  el.innerHTML='<span class="lab">'+label+'</span>';
  for(var i=0;i<arr.length;i++){ el.appendChild(smallPiece(arr[i],color)); }
}


/* ---- status ---- */
function status(){
  var dot=$("dot"), msg=$("statusMsg"), en=$("statusEn");
  if(G.busy){ msg.textContent=T.thinking; en.textContent="Computer thinking"; dot.className="dot think"; return; }
  var k=kingSq(G.state.b,G.state.turn); var inChk=k&&isAttacked(G.state.b,k[0],k[1],G.state.turn==="w"?"b":"w");
  if(inChk){ msg.textContent=T.yourTurn+" \u2014 "+T.check; en.textContent="Check"; dot.className="dot chk"; }
  else { msg.textContent=T.yourTurn; en.textContent="Your turn"; dot.className="dot"; }
}

/* ---- interaction ---- */
boardEl.addEventListener("click",function(ev){
  var cell=ev.target.closest(".sq"); if(!cell) return;
  if(G.over||G.busy||G.state.turn!==G.player) return;
  var r=parseInt(cell.dataset.r,10), c=parseInt(cell.dataset.c,10);
  if(G.sel){
    var picked=null;
    for(var i=0;i<G.legal.length;i++){ if(G.legal[i].to[0]===r&&G.legal[i].to[1]===c){ picked=G.legal[i]; break; } }
    if(picked){ handlePicked(r,c); return; }
  }
  var p=G.state.b[r][c];
  if(p&&p.c===G.player){ G.sel=[r,c]; G.legal=genMoves(G.state).filter(function(m){return m.from[0]===r&&m.from[1]===c;}); render(); }
  else { G.sel=null; G.legal=[]; render(); }
});
function handlePicked(r,c){
  var opts=G.legal.filter(function(m){return m.to[0]===r&&m.to[1]===c;});
  if(opts.length>1 && opts[0].promo){ showPromo(opts); return; }
  applyMove(opts[0]);
}
function showPromo(opts){
  var order=["Q","R","B","N"]; var byp={}; opts.forEach(function(m){byp[m.promo]=m;});
  var html='<div class="modal"><h2>'+T.promoT+'</h2><div class="promorow">';
  html+='</div></div>';
  $("modalMount").innerHTML='<div class="scrim">'+html+'</div>';
  var row=$("modalMount").querySelector(".promorow");
  order.forEach(function(t){ if(!byp[t]) return; var b=document.createElement("button"); b.appendChild(smallPieceBig(t,G.player)); b.onclick=function(){ closeModal(); applyMove(byp[t]); }; row.appendChild(b); });
}


function applyMove(m){
  G.history.push(G.state);
  var cap = m.cap || m.ep;
  G.state=makeMove(G.state,m); G.last={from:m.from,to:m.to}; G.sel=null; G.legal=[];
  render();
  var k=kingSq(G.state.b,G.state.turn); var inChk=k&&isAttacked(G.state.b,k[0],k[1],G.state.turn==="w"?"b":"w");
  if(cap) sCap(); else if(inChk) sChk(); else sMove();
  if(checkEnd()) return;
  if(G.state.turn===G.ai){ aiMove(); } else { status(); }
}
function aiMove(){
  if(G.over) return;
  G.busy=true; status();
  setTimeout(function(){
    var m=searchBest(G.state, G.opt);
    G.busy=false;
    if(!m){ checkEnd(); return; }
    G.history.push(G.state);
    var cap=m.cap||m.ep;
    G.state=makeMove(G.state,m); G.last={from:m.from,to:m.to};
    render();
    var k=kingSq(G.state.b,G.state.turn); var inChk=k&&isAttacked(G.state.b,k[0],k[1],G.state.turn==="w"?"b":"w");
    if(cap) sCap(); else if(inChk) sChk(); else sMove();
    if(checkEnd()) return;
    status();
  }, 60);
}

/* ---- end detection ---- */
function insufficient(s){
  var pieces=[]; for(var r=0;r<8;r++)for(var c=0;c<8;c++){var p=s.b[r][c]; if(p&&p.t!=="K") pieces.push(p.t);}
  if(pieces.length===0) return true;
  if(pieces.length===1 && (pieces[0]==="N"||pieces[0]==="B")) return true;
  if(pieces.length===2 && pieces[0]==="B"&&pieces[1]==="B") return true; // simplified
  return false;
}
function checkEnd(){
  var ms=genMoves(G.state);
  if(ms.length===0){
    var k=kingSq(G.state.b,G.state.turn); var inChk=k&&isAttacked(G.state.b,k[0],k[1],G.state.turn==="w"?"b":"w");
    if(inChk){ // side to move is mated -> the OTHER side won
      var won = (G.state.turn!==G.player);
      endModal(won?"win":"lose"); }
    else endModal("stale");
    return true;
  }
  if(insufficient(G.state) || G.state.half>=100){ endModal("draw"); return true; }
  return false;
}
function endModal(kind){
  G.over=true;
  var icon,title,body;
  if(kind==="win"){ icon="&#11088;"; title=T.winT; body=T.winB; sWin(); confetti(); }
  else if(kind==="lose"){ icon="&#128302;"; title=T.loseT; body=T.loseB; }
  else if(kind==="stale"){ icon="&#129309;"; title=T.staleB; body=T.drawB; }
  else { icon="&#129309;"; title=T.drawT; body=T.drawB; }
  $("modalMount").innerHTML='<div class="scrim"><div class="modal"><div class="big">'+icon+'</div><h2>'+title+'</h2><p>'+body+'</p>'+
    '<button class="go" id="mNew">'+T.newGame+'</button><button class="ghost" id="mMenu">'+T.menu+'</button></div></div>';
  $("mNew").onclick=function(){ closeModal(); startGame(); };
  $("mMenu").onclick=function(){ closeModal(); toMenu(); };
}
function closeModal(){ $("modalMount").innerHTML=""; }

/* ---- controls ---- */
$("menuBtn").onclick=toMenu; $("menu2Btn").onclick=toMenu;
function toMenu(){ closeModal(); $("gameScreen").classList.add("hidden"); $("startScreen").classList.remove("hidden"); buildStart(); window.scrollTo(0,0); }
$("newBtn").onclick=function(){ startGame(); };
$("undoBtn").onclick=function(){
  if(G.busy||G.history.length===0) return;
  G.state=G.history.pop();
  if(G.history.length>0 && G.state.turn!==G.player) G.state=G.history.pop();
  G.sel=null; G.legal=[]; G.over=false; G.last=null; render(); status();
};
$("hintBtn").onclick=function(){
  if(G.over||G.busy||G.state.turn!==G.player) return;
  var m=searchBest(G.state,{maxDepth:2,timeMs:400});
  if(!m) return;
  flash([m.from,m.to]);
};
function flash(sqs){
  sqs.forEach(function(s){ var el=boardEl.querySelector('.sq[data-r="'+s[0]+'"][data-c="'+s[1]+'"]'); if(el){ el.classList.add("hint"); setTimeout(function(){el.classList.remove("hint");},1200); } });
}
$("soundBtn").onclick=function(){ soundOn=!soundOn; this.textContent=soundOn?T.soundOn:T.soundOff; if(soundOn) tone(660,0.07); };

/* ---- confetti ---- */
var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(){ if(reduce) return; var cols=["#34d1ff","#ffd166","#5aa0ff","#8ee6ff","#ffe9a8"];
  for(var i=0;i<70;i++){ (function(){ var d=document.createElement("div"); d.className="confetti"; d.style.left=(Math.random()*100)+"vw"; d.style.background=cols[Math.floor(Math.random()*cols.length)]; document.body.appendChild(d);
    var a=d.animate([{transform:"translateY(0) rotate(0)",opacity:1},{transform:"translateY(105vh) rotate("+(Math.random()*720)+"deg)",opacity:.9}],{duration:1800+Math.random()*1400,easing:"cubic-bezier(.2,.6,.5,1)"}); a.onfinish=function(){d.remove();}; })(); }
}

/* ---- boot ---- */
buildStart();
$("playBtn").onclick=startGame;
</script>
</body>
</html>
