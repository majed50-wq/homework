<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision PDF OCR (Local App)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const UploadIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>;
    const LoaderIcon = () => <svg className="animate-spin" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>;
    const DownloadIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
    const PlayIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
    const AlertIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>;
    const ActivityIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
    const DocumentIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
    const TokenIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>;

    const LIMITS = { RPM: 15, DAILY_CALLS: 1500, DAILY_TOKENS: 4000000 };

    function App() {
      const [isReady, setIsReady] = useState(false);
      const [isParsing, setIsParsing] = useState(false);
      const [isProcessingGlobal, setIsProcessingGlobal] = useState(false);
      const [pages, setPages] = useState([]);
      const [fileName, setFileName] = useState("");
      const [errorMsg, setErrorMsg] = useState("");
      const [userApiKey, setUserApiKey] = useState("");
      const [requestTimestamps, setRequestTimestamps] = useState([]);
      const [isCoolingDown, setIsCoolingDown] = useState(false);
      const [sessionPagesCount, setSessionPagesCount] = useState(0);
      const [sessionTokenCount, setSessionTokenCount] = useState(0);
      const fileInputRef = useRef(null);

      useEffect(() => {
        const loadDependencies = async () => {
          try {
            await new Promise((resolve, reject) => {
              const script = document.createElement("script");
              script.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
              script.onload = resolve; script.onerror = reject;
              document.head.appendChild(script);
            });
            if (window["pdfjs-dist/build/pdf"]) {
              const workerUrl = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
              const workerBlob = new Blob(["importScripts('" + workerUrl + "');"], { type: "text/javascript" });
              window["pdfjs-dist/build/pdf"].GlobalWorkerOptions.workerPort = new Worker(URL.createObjectURL(workerBlob));
            }
            setIsReady(true);
          } catch (e) { setErrorMsg("Failed to load PDF Engine. Check internet."); }
        };
        loadDependencies();
      }, []);

      useEffect(() => {
        const interval = setInterval(() => {
          const now = Date.now();
          setRequestTimestamps(prev => prev.filter(ts => now - ts < 60000));
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      const handleFileUpload = async (event) => {
        const file = event.target.files[0];
        if (!file || file.type !== "application/pdf") { setErrorMsg("Please upload a PDF file."); return; }
        setFileName(file.name); setErrorMsg(""); setIsParsing(true); setPages([]);
        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdfjsLib = window["pdfjs-dist/build/pdf"];
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          const numPages = pdf.numPages;
          const extractedPages = [];
          for (let i = 1; i <= numPages; i++) {
            const page = await pdf.getPage(i);
            const viewport = page.getViewport({ scale: 2.0 });
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            canvas.height = viewport.height; canvas.width = viewport.width;
            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            extractedPages.push({ id: i, image: canvas.toDataURL("image/jpeg", 0.9), text: "", status: "idle", error: "" });
          }
          setPages(extractedPages);
        } catch (err) { console.error(err); setErrorMsg("Error reading PDF."); }
        finally { setIsParsing(false); if (fileInputRef.current) fileInputRef.current.value = ""; }
      };

      const performOCR = async (base64Image) => {
        if (!userApiKey) throw new Error("API_KEY_MISSING");
        if (sessionPagesCount >= LIMITS.DAILY_CALLS) throw new Error("DAILY_LIMIT_REACHED");
        const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=" + userApiKey;
        const payload = {
          contents: [{ role: "user", parts: [
            { text: "Extract all the text from this image exactly as it appears. Preserve the formatting, line breaks, and paragraphs where possible. Output the text in its original language, maintaining appropriate Right-to-Left styling if it is Arabic." },
            { inlineData: { mimeType: "image/jpeg", data: base64Image.split(",")[1] } }
          ] }]
        };
        let retries = 5; let delay = 2000;
        while(retries > 0) {
          try {
            setRequestTimestamps(prev => [...prev, Date.now()]);
            const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
            if (response.status === 429) { setIsCoolingDown(true); throw new Error("RATE_LIMIT"); }
            if (response.status === 400 || response.status === 403) throw new Error("INVALID_KEY");
            if (!response.ok) throw new Error("HTTP_ERROR");
            const result = await response.json();
            setIsCoolingDown(false);
            return result.candidates?.[0]?.content?.parts?.[0]?.text || "";
          } catch (e) {
            if (e.message === "DAILY_LIMIT_REACHED" || e.message === "INVALID_KEY") throw e;
            retries--; if (retries === 0) { setIsCoolingDown(false); throw e; }
            await new Promise(r => setTimeout(r, delay)); delay *= 2;
          }
        }
      };

      const processPage = async (pageId) => {
        if (!userApiKey) { setErrorMsg("Please enter your Gemini API Key at the top."); return; }
        setPages(prev => prev.map(p => p.id === pageId ? { ...p, status: "processing", error: "" } : p));
        const pageToProcess = pages.find(p => p.id === pageId); if (!pageToProcess) return;
        try {
          const extractedText = await performOCR(pageToProcess.image);
          setPages(prev => prev.map(p => p.id === pageId ? { ...p, status: "done", text: extractedText } : p));
          setSessionPagesCount(prev => prev + 1);
          setSessionTokenCount(prev => prev + 258 + Math.ceil((extractedText.length || 0) / 4));
        } catch (error) {
          if (error.message === "API_KEY_MISSING") { setErrorMsg("Please enter your API Key."); setPages(prev => prev.map(p => p.id === pageId ? { ...p, status: "idle" } : p)); }
          else if (error.message === "INVALID_KEY") { setErrorMsg("Invalid API Key."); setPages(prev => prev.map(p => p.id === pageId ? { ...p, status: "error", error: "Invalid API Key" } : p)); }
          else if (error.message === "DAILY_LIMIT_REACHED") { setPages(prev => prev.map(p => p.id === pageId ? { ...p, status: "error", error: "Daily limit reached." } : p)); }
          else { setPages(prev => prev.map(p => p.id === pageId ? { ...p, status: "error", error: "OCR Failed. Retry." } : p)); }
        }
      };

      const processAllPages = async () => {
        if (!userApiKey) { setErrorMsg("Please enter your API Key first."); return; }
        setIsProcessingGlobal(true);
        for (let i = 0; i < pages.length; i++) {
          if (sessionPagesCount + i >= LIMITS.DAILY_CALLS) { setErrorMsg("Daily limit reached."); break; }
          if (pages[i].status !== "done" && pages[i].status !== "error") { await processPage(pages[i].id); await new Promise(r => setTimeout(r, 1200)); }
        }
        setIsProcessingGlobal(false);
      };

      const exportToPDF = () => {
        const iframe = document.createElement("iframe"); iframe.style.display = "none"; document.body.appendChild(iframe);
        const iframeDoc = iframe.contentWindow.document; iframeDoc.open();
        let htmlContent = ["<!DOCTYPE html>", "<html lang=\"en\"><head><title>Export</title>", "<style>@page { size: A4; margin: 20mm; } body { font-family: system-ui, sans-serif; font-size: 13pt; line-height: 1.6; color: #000; margin: 0; padding: 0; } .page { white-space: pre-wrap; page-break-after: always; } .page:last-child { page-break-after: auto; }</style>", "</head><body>"].join("");
        pages.forEach(page => {
           if (page.text && page.text.trim()) {
             const safeText = page.text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
             htmlContent += "<div class=\"page\" dir=\"auto\">" + safeText + "</div>";
           }
        });
        htmlContent += "</body></html>";
        iframeDoc.write(htmlContent); iframeDoc.close();
        iframe.onload = () => { iframe.contentWindow.focus(); iframe.contentWindow.print(); setTimeout(() => document.body.removeChild(iframe), 2000); };
      };

      const allProcessed = pages.length > 0 && pages.every(p => p.status === "done");
      const someProcessed = pages.some(p => p.status === "done");
      const isDailyLimitReached = sessionPagesCount >= LIMITS.DAILY_CALLS;
      const rpmPercentage = Math.min((requestTimestamps.length / LIMITS.RPM) * 100, 100);
      const callsPercentage = Math.min((sessionPagesCount / LIMITS.DAILY_CALLS) * 100, 100);
      const tokenPercentage = Math.min((sessionTokenCount / LIMITS.DAILY_TOKENS) * 100, 100);
      const getMeterColor = (percent) => percent > 90 ? "bg-red-500" : percent > 60 ? "bg-yellow-500" : "bg-green-500";

      if (!isReady) return <div className="min-h-screen flex items-center justify-center bg-gray-50 text-gray-500"><LoaderIcon /><span className="ml-3 font-medium text-lg">Initializing Engines...</span></div>;

      return (
        <div className="min-h-screen bg-slate-50 pb-20">
          <header className="bg-white shadow-sm sticky top-0 z-20">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
              <div className="mb-4 flex items-center gap-4 bg-slate-100 p-3 rounded-lg border border-slate-200">
                 <div className="text-sm font-medium text-slate-700 whitespace-nowrap">Gemini API Key:</div>
                 <input type="password" value={userApiKey} onChange={(e) => setUserApiKey(e.target.value)} placeholder="Paste AI key here..." className="flex-1 px-3 py-1.5 text-sm rounded border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                 <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-xs text-blue-600 hover:underline whitespace-nowrap">Get free API Key</a>
              </div>
              <div className="flex flex-col sm:flex-row justify-between items-center gap-4 mb-4">
                <div className="flex items-center gap-3">
                  <div className="bg-blue-600 text-white p-2 rounded-lg shadow-sm"><ActivityIcon /></div>
                  <h1 className="text-2xl font-bold text-blue-800">AI Vision OCR (Local)</h1>
                </div>
                <div className="flex items-center gap-3 w-full sm:w-auto">
                  <input type="file" accept=".pdf" className="hidden" ref={fileInputRef} onChange={handleFileUpload} disabled={isDailyLimitReached} />
                  <button onClick={() => fileInputRef.current.click()} disabled={isParsing || isDailyLimitReached} className={"flex-1 sm:flex-none flex justify-center items-center gap-2 px-4 py-2 rounded-lg font-medium transition-colors shadow-sm " + (isParsing ? "bg-gray-100 text-gray-400" : "bg-white border border-gray-300 text-gray-700 hover:bg-gray-50")}>{isParsing ? <LoaderIcon /> : <UploadIcon />} {isParsing ? "Reading..." : "Upload PDF"}</button>
                  {pages.length > 0 && <button onClick={exportToPDF} disabled={!someProcessed} className={"flex-1 sm:flex-none flex justify-center items-center gap-2 px-4 py-2 rounded-lg font-medium transition-colors shadow-sm text-white " + (!someProcessed ? "bg-indigo-300 cursor-not-allowed" : "bg-indigo-600 hover:bg-indigo-700")}><DownloadIcon /> Save PDF</button>}
                </div>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="bg-gray-50 rounded-lg p-3 border border-gray-200">
                  <div className="flex justify-between items-end w-full mb-1"><div className="flex items-center gap-1.5 text-xs font-semibold text-gray-700 uppercase"><ActivityIcon /> Speed (RPM)</div>{isCoolingDown && <span className="text-[10px] text-red-600 animate-pulse bg-red-100 px-1.5 rounded">Cooling down</span>}</div>
                  <div className="flex items-baseline gap-1 mt-1"><span className="font-bold text-lg text-gray-800">{requestTimestamps.length}</span><span className="text-gray-500 text-xs font-medium">/ {LIMITS.RPM}</span></div>
                  <div className="w-full bg-gray-200 rounded-full h-1.5 mt-2"><div className={"h-1.5 rounded-full transition-all duration-500 " + (isCoolingDown ? "bg-red-500" : getMeterColor(rpmPercentage))} style={{ width: rpmPercentage + "%" }}></div></div>
                </div>
                <div className="bg-blue-50 rounded-lg p-3 border border-blue-100">
                  <div className="flex justify-between items-end w-full mb-1"><div className="flex items-center gap-1.5 text-xs font-semibold text-blue-800 uppercase"><DocumentIcon /> API Calls</div>{isDailyLimitReached && <span className="text-[10px] text-red-600 bg-red-100 px-1.5 rounded font-bold">LIMIT REACHED</span>}</div>
                  <div className="flex items-baseline gap-1 mt-1"><span className="font-bold text-lg text-blue-900">{sessionPagesCount.toLocaleString()}</span><span className="text-blue-500 text-xs font-medium">/ {LIMITS.DAILY_CALLS.toLocaleString()}</span></div>
                  <div className="w-full bg-blue-200/60 rounded-full h-1.5 mt-2"><div className={"h-1.5 rounded-full transition-all duration-700 " + getMeterColor(callsPercentage)} style={{ width: callsPercentage + "%" }}></div></div>
                </div>
                <div className="bg-indigo-50 rounded-lg p-3 border border-indigo-100">
                  <div className="flex justify-between items-end w-full mb-1"><div className="flex items-center gap-1.5 text-xs font-semibold text-indigo-800 uppercase"><TokenIcon /> Tokens</div></div>
                  <div className="flex items-baseline gap-1 mt-1"><span className="font-bold text-lg text-indigo-900">{sessionTokenCount.toLocaleString()}</span><span className="text-indigo-400 text-xs font-medium">/ {LIMITS.DAILY_TOKENS.toLocaleString()}</span></div>
                  <div className="w-full bg-indigo-200/60 rounded-full h-1.5 mt-2"><div className={"h-1.5 rounded-full transition-all duration-700 " + getMeterColor(tokenPercentage)} style={{ width: tokenPercentage + "%" }}></div></div>
                </div>
              </div>
            </div>
          </header>
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {errorMsg && <div className="bg-red-50 border-l-4 border-red-500 p-4 mb-6 flex items-center justify-between"><div className="flex items-center"><AlertIcon /><p className="text-red-700 ml-2">{errorMsg}</p></div><button onClick={() => setErrorMsg("")} className="text-red-500 hover:text-red-700">&times;</button></div>}
            {pages.length === 0 && !isParsing && (
              <div onClick={() => !isDailyLimitReached && fileInputRef.current.click()} className={"border-2 border-dashed rounded-2xl p-12 flex flex-col items-center text-center transition-colors " + (isDailyLimitReached ? "border-red-200 bg-red-50" : "border-gray-300 bg-white hover:bg-gray-50 cursor-pointer")}>
                <div className={"rounded-full p-4 mb-4 " + (isDailyLimitReached ? "bg-red-100 text-red-500" : "bg-blue-50 text-blue-500")}><UploadIcon /></div>
                <h3 className="text-xl font-semibold text-gray-800 mb-2">{isDailyLimitReached ? "Daily Limit Reached" : "Upload a PDF"}</h3>
                <p className="text-gray-500 max-w-md">Extract Arabic & English text seamlessly from any document.</p>
              </div>
            )}
            {pages.length > 0 && (
              <div className="space-y-6">
                <div className="flex justify-between items-end mb-4">
                  <div><h2 className="text-lg font-semibold text-gray-800">Pages ({pages.length})</h2></div>
                  {!allProcessed && !isDailyLimitReached && <button onClick={processAllPages} disabled={isProcessingGlobal} className={"flex items-center gap-2 px-4 py-2 rounded-lg font-medium shadow-sm " + (isCoolingDown ? "bg-red-100 text-red-600" : "bg-blue-100 hover:bg-blue-200 text-blue-700")}>{isProcessingGlobal ? <LoaderIcon /> : <PlayIcon />} {isCoolingDown ? "Cooling down..." : "Extract All"}</button>}
                </div>
                <div className="grid grid-cols-1 gap-8">
                  {pages.map((page) => (
                    <div key={page.id} className="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col lg:flex-row overflow-hidden">
                      <div className="lg:w-1/2 bg-gray-100 border-b lg:border-b-0 lg:border-r border-gray-200 relative group flex items-center justify-center p-4 min-h-[300px]">
                        <div className="absolute top-4 left-4 bg-black/60 text-white text-xs font-bold px-2 py-1 rounded z-10">PAGE {page.id}</div>
                        <img src={page.image} alt={"Page " + page.id} className="max-h-[800px] object-contain shadow-md rounded" />
                        {page.status === "idle" && !isDailyLimitReached && <div className="absolute inset-0 bg-white/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><button onClick={() => processPage(page.id)} className="bg-blue-600 text-white px-6 py-3 rounded-full shadow-lg font-medium flex items-center gap-2 hover:scale-105 transition-transform"><PlayIcon /> Extract</button></div>}
                        {page.status === "processing" && <div className="absolute inset-0 bg-white/60 flex flex-col items-center justify-center"><LoaderIcon /><p className="mt-2 font-medium">Reading page {page.id}...</p></div>}
                      </div>
                      <div className="lg:w-1/2 flex flex-col relative min-h-[300px]">
                        {page.status === "idle" ? <div className="flex-1 flex flex-col items-center justify-center text-gray-400 bg-gray-50 p-8 text-center"><p>{isDailyLimitReached ? "Limits exhausted." : "Awaiting extraction."}</p></div> : <textarea dir="auto" value={page.text} onChange={(e) => handleTextChange(page.id, e.target.value)} className={"flex-1 w-full p-6 resize-none outline-none text-gray-700 leading-relaxed font-sans text-lg " + (page.status === "processing" ? "opacity-50 bg-gray-50" : "bg-white")} disabled={page.status === "processing"} />}
                        {page.error && <div className="absolute bottom-4 left-4 right-4 bg-red-100 text-red-700 p-3 rounded flex justify-between shadow-sm"><span>{page.error}</span>{!isDailyLimitReached && <button onClick={() => processPage(page.id)} className="underline font-medium">Retry</button>}</div>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
