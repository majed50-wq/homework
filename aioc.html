<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Arabic Cloud Vision OCR</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        .arabic-text {
            font-family: 'Tajawal', sans-serif;
            line-height: 1.8;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-8 font-sans flex justify-center">
    
    <div class="max-w-4xl w-full bg-white rounded-xl shadow-lg p-8">
        <div class="flex items-center justify-between mb-2">
            <h1 class="text-3xl font-bold text-slate-800">Arabic Cloud Vision OCR</h1>
            <span class="bg-purple-100 text-purple-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">Powered by Gemini AI</span>
        </div>
        <p class="text-slate-500 mb-6">Extract highly accurate Arabic text using modern cloud AI vision models.</p>
        
        <div id="debugBox" class="hidden bg-red-50 border-l-4 border-red-500 p-4 mb-6">
            <div class="flex">
                <div class="ml-3">
                    <p class="text-sm text-red-700 font-bold" id="debugText"></p>
                </div>
            </div>
        </div>

        <div class="mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
            <label class="block text-sm font-bold text-slate-700 mb-2">Google Gemini API Key</label>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="block w-full border border-slate-300 rounded-lg p-2.5 focus:ring-purple-500 focus:border-purple-500 transition-all font-mono text-sm" autocomplete="off">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-bold text-slate-700 mb-2">Upload Scanned PDF</label>
            <input type="file" id="pdfInput" accept="application/pdf" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100 border border-slate-300 rounded-lg p-2 cursor-pointer transition-all">
        </div>

        <div class="flex gap-4 mb-6">
            <button id="startBtn" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 px-6 rounded-lg transition-colors shadow-sm">Start Vision Extraction</button>
            <button id="exportBtn" disabled class="bg-slate-800 hover:bg-slate-900 disabled:bg-slate-300 text-white font-bold py-2.5 px-6 rounded-lg transition-colors cursor-not-allowed shadow-sm">Export to PDF</button>
        </div>

        <div class="mb-6">
            <div class="flex justify-between mb-2">
                <span id="statusText" class="text-sm font-medium text-slate-700">Waiting to start...</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                <div id="progressBar" class="bg-purple-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Extracted Arabic Text (Review & Edit)</label>
            <textarea id="resultTextArea" dir="rtl" class="w-full h-96 p-5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 arabic-text text-lg resize-y bg-white shadow-inner" placeholder="سيظهر النص المستخرج هنا..."></textarea>
        </div>
    </div>

    <script>
        // Global error handler to catch unseen script/syntax issues on mobile
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const debugBox = document.getElementById('debugBox');
            const debugText = document.getElementById('debugText');
            if(debugBox && debugText) {
                debugBox.classList.remove('hidden');
                debugText.innerText = "JavaScript Error: " + msg + " (Line " + lineNo + ")";
            }
            return false;
        };

        document.addEventListener("DOMContentLoaded", () => {
            const apiKeyInput = document.getElementById('apiKeyInput');
            const fileInput = document.getElementById('pdfInput');
            const startBtn = document.getElementById('startBtn');
            const exportBtn = document.getElementById('exportBtn');
            const statusText = document.getElementById('statusText');
            const progressBar = document.getElementById('progressBar');
            const resultTextArea = document.getElementById('resultTextArea');
            const debugBox = document.getElementById('debugBox');
            const debugText = document.getElementById('debugText');

            // 1. Verify PDF.js actually loaded from the CDN
            if (typeof pdfjsLib === 'undefined') {
                debugBox.classList.remove('hidden');
                debugText.innerText = "Critical Error: The PDF.js library failed to load. Please check your internet connection or disable any Safari content blockers.";
                startBtn.disabled = true;
                startBtn.classList.add('cursor-not-allowed', 'opacity-50');
                return;
            }

            // Initialize PDF.js worker
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            // --- AI VISION OCR LOGIC ---
            startBtn.addEventListener('click', async () => {
                // Clear any old error messages
                debugBox.classList.add('hidden');
                
                const apiKey = apiKeyInput.value.trim();
                
                if (!apiKey) {
                    alert("Please enter your Gemini API Key first.");
                    apiKeyInput.focus();
                    return;
                }
                
                if (!fileInput.files.length) {
                    alert("Please select a PDF document to scan.");
                    return;
                }

                const file = fileInput.files[0];
                startBtn.disabled = true;
                exportBtn.disabled = true;
                exportBtn.classList.add('cursor-not-allowed');
                resultTextArea.value = "";
                statusText.innerText = "Loading PDF document...";
                progressBar.style.width = "5%";

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    
                    let fullExtractedText = "";

                    // Process each page sequentially
                    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                        statusText.innerText = `Preparing page ${pageNum} of ${pdf.numPages} for AI...`;
                        const page = await pdf.getPage(pageNum);
                        
                        // Render PDF page to canvas
                        const viewport = page.getViewport({ scale: 1.5 }); 
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        
                        await page.render({ canvasContext: context, viewport: viewport }).promise;
                        
                        // Convert canvas to Base64 JPEG
                        const base64DataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        const base64Image = base64DataUrl.split(',')[1]; 

                        statusText.innerText = `Page ${pageNum}: Sending to Gemini 3.5 Flash...`;

                        // Send image to the Gemini API endpoint
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: "Extract all the text from this image exactly as it appears. It contains Arabic text. Preserve the paragraphs, layout, and right-to-left direction logically. Do not add any conversational filler, introductory remarks, or markdown code blocks around the text. Just return the raw extracted text." },
                                        { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                                    ]
                                }]
                            })
                        });

                        if (!response.ok) {
                            const errData = await response.json();
                            throw new Error(errData.error?.message || "API request failed. Check API Key or Model limits.");
                        }

                        const data = await response.json();
                        
                        let extractedText = "";
                        if (data.candidates && data.candidates[0].content.parts.length > 0) {
                            extractedText = data.candidates[0].content.parts[0].text;
                        }

                        fullExtractedText += extractedText.trim() + "\n\n";
                        resultTextArea.value = fullExtractedText;
                        resultTextArea.scrollTop = resultTextArea.scrollHeight;

                        // Update Progress
                        const progressPercentage = (pageNum / pdf.numPages) * 100;
                        progressBar.style.width = `${progressPercentage}%`;
                    }

                    statusText.innerText = "Vision OCR Complete! Review your text before exporting.";
                    exportBtn.disabled = false;
                    exportBtn.classList.remove('cursor-not-allowed');

                } catch (error) {
                    console.error("OCR Error:", error);
                    debugBox.classList.remove('hidden');
                    debugText.innerText = `Error: ${error.message}`;
                    statusText.innerText = "Processing failed.";
                    progressBar.style.width = "0%";
                    progressBar.classList.add('bg-red-500');
                } finally {
                    startBtn.disabled = false;
                }
            });

            // --- EXPORT LOGIC ---
            exportBtn.addEventListener('click', () => {
                const text = resultTextArea.value;
                if (!text.trim()) {
                    alert("No text to export!");
                    return;
                }

                statusText.innerText = "Generating new PDF document...";

                const printContainer = document.createElement('div');
                
                printContainer.innerHTML = text.split('\n').map(line => `<p style="margin-bottom: 12px;">${line}</p>`).join('');
                
                printContainer.style.direction = 'rtl';
                printContainer.style.textAlign = 'right';
                printContainer.style.fontFamily = "'Tajawal', Arial, sans-serif";
                printContainer.style.fontSize = '16px';
                printContainer.style.color = '#1e293b'; 
                printContainer.style.padding = '30px';
                printContainer.style.backgroundColor = '#ffffff';

                document.body.appendChild(printContainer);
                
                const opt = {
                    margin:       0.5,
                    filename:     'Extracted_Vision_Document.pdf',
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2 },
                    jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
                };

                html2pdf().set(opt).from(printContainer).save().then(() => {
                    statusText.innerText = "PDF Exported Successfully!";
                    document.body.removeChild(printContainer);
                });
            });
        });
    </script>
</body>
</html>
