<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Science & Geography Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxZxJi382ulDmIGSSKpwPkGi7hq-P6FTIJQhTy7wbYZrkYFDJB8wWWPehA1YXOc4ne3/exec"; 

        const ClockIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const PlayIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"/></svg>;
        const SendIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>;
        const CheckIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>;

        function App() {
            const [timeLeft, setTimeLeft] = useState(60);
            const [quizActive, setQuizActive] = useState(false);
            const [submitted, setSubmitted] = useState(false);
            const [isSending, setIsSending] = useState(false);
            const [formData, setFormData] = useState({ studentName: '', answer1: '', answer2: '' });

            useEffect(() => {
                let timer;
                if (quizActive && timeLeft > 0) {
                    timer = setInterval(() => setTimeLeft((prev) => prev - 1), 1000);
                } else if (timeLeft === 0) {
                    setQuizActive(false);
                }
                return () => clearInterval(timer);
            }, [quizActive, timeLeft]);

            const startQuiz = () => {
                setTimeLeft(60);
                setQuizActive(true);
                setSubmitted(false);
            };

            const handleInputChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!quizActive || isSending) return;

                setIsSending(true);

                const data = new FormData();
                data.append('studentName', formData.studentName || "Anonymous");
                const combinedAnswer = `Q1: ${formData.answer1} | Q2: ${formData.answer2}`;
                data.append('answer', combinedAnswer); 
                
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: data,
                    mode: 'no-cors'
                }).then(() => {
                    setIsSending(false);
                    setSubmitted(true);
                    setQuizActive(false);
                }).catch(error => {
                    console.error('Error!', error.message);
                    alert("There was an issue sending. Please try again.");
                    setIsSending(false);
                });
            };

            return (
                <div className="max-w-xl mx-auto md:mt-8 md:p-4">
                    <div className="bg-white md:rounded-2xl shadow-xl overflow-hidden min-h-screen md:min-h-0 border border-gray-100">
                        <div className="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-6 flex justify-between items-center shadow-md">
                            <div>
                                <h1 className="text-xl md:text-2xl font-bold">Today's Assignment</h1>
                                <p className="text-blue-100 text-sm mt-1">Complete before the timer ends!</p>
                            </div>
                            <div className={`flex items-center space-x-2 px-3 py-1.5 md:px-4 md:py-2 rounded-lg font-mono text-lg md:text-xl font-bold shadow-inner ${timeLeft <= 10 && quizActive ? 'bg-red-500 animate-pulse' : 'bg-black/20'}`}>
                                <ClockIcon className="w-5 h-5" />
                                <span>00:${timeLeft.toString().padStart(2, '0')}</span>
                            </div>
                        </div>

                        <div className="p-6 md:p-8">
                            {submitted ? (
                                <div className="text-center py-16 animate-fade-in">
                                    <div className="bg-green-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6">
                                        <CheckIcon className="w-10 h-10 text-green-600" />
                                    </div>
                                    <h2 className="text-2xl font-bold text-gray-800 mb-2">Submitted Successfully!</h2>
                                    <p className="text-gray-600">Your answers have been securely sent to your teacher.</p>
                                    <p className="text-gray-500 mt-8 text-sm">You may now close this page.</p>
                                </div>
                            ) : !quizActive && timeLeft === 60 ? (
                                <div className="text-center py-16">
                                    <h2 className="text-2xl font-bold text-gray-800 mb-4">Ready to start?</h2>
                                    <p className="text-gray-600 mb-8">Once you click start, you will have 60 seconds to complete your work.</p>
                                    <button 
                                        onClick={startQuiz}
                                        className="flex items-center mx-auto bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-full font-bold text-lg transition-transform transform hover:scale-105 shadow-lg shadow-blue-200"
                                    >
                                        <PlayIcon className="w-6 h-6 mr-3" />
                                        Start Assignment
                                    </button>
                                </div>
                            ) : (
                                <form onSubmit={handleSubmit} className="space-y-6">
                                    <div className="space-y-2">
                                        <label className="block text-sm font-bold text-gray-700 uppercase tracking-wide">Your Full Name</label>
                                        <input
                                            type="text"
                                            name="studentName"
                                            required
                                            disabled={!quizActive || isSending}
                                            value={formData.studentName}
                                            onChange={handleInputChange}
                                            className="w-full p-4 border-2 border-gray-200 rounded-xl focus:ring-0 focus:border-blue-500 transition-colors disabled:bg-gray-100 disabled:text-gray-500 text-lg"
                                            placeholder="First and Last Name"
                                        />
                                    </div>

                                    <div className="space-y-3 bg-blue-50/50 p-5 rounded-2xl border-2 border-blue-100">
                                        <label className="block font-semibold text-gray-800 text-lg leading-snug">
                                            1. What is the capital of France?
                                        </label>
                                        <input
                                            type="text"
                                            name="answer1"
                                            required
                                            disabled={!quizActive || isSending}
                                            value={formData.answer1}
                                            onChange={handleInputChange}
                                            className="w-full p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-100 disabled:text-gray-500 text-lg"
                                            placeholder="Type your answer..."
                                        />
                                    </div>

                                    <div className="space-y-3 bg-indigo-50/50 p-5 rounded-2xl border-2 border-indigo-100">
                                        <label className="block font-semibold text-gray-800 text-lg leading-snug">
                                            2. Explain how plants get their green color.
                                        </label>
                                        <textarea
                                            name="answer2"
                                            required
                                            disabled={!quizActive || isSending}
                                            value={formData.answer2}
                                            onChange={handleInputChange}
                                            rows="4"
                                            className="w-full p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 disabled:bg-gray-100 disabled:text-gray-500 text-lg resize-none"
                                            placeholder="Write your explanation..."
                                        ></textarea>
                                    </div>

                                    <button
                                        type="submit"
                                        disabled={!quizActive || isSending}
                                        className={`w-full flex justify-center items-center py-4 rounded-xl font-bold text-xl transition-all ${isSending ? 'bg-blue-400 text-white cursor-wait' : quizActive ? 'bg-blue-600 hover:bg-blue-700 text-white shadow-xl shadow-blue-200 hover:-translate-y-1' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
                                    >
                                        {isSending ? 'Sending securely...' : quizActive ? <><SendIcon className="w-6 h-6 mr-2" />Submit Answers</> : 'Time is up! Form Locked.'}
                                    </button>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
