<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Grading Quiz App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Inline SVG Icons ---
        const UserIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        );
        const TableIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/></svg>
        );
        const ClockIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        );
        const PlayIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"/></svg>
        );
        const SendIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        );
        const CheckCircleIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        );
        const XCircleIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/></svg>
        );
        const DownloadIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        );

        function App() {
            const [view, setView] = useState('student'); // 'student' or 'teacher'
            const [submissions, setSubmissions] = useState([]);
            const [timeLeft, setTimeLeft] = useState(60); 
            const [quizActive, setQuizActive] = useState(false);
            const [formData, setFormData] = useState({ studentName: '', q1: '', q2: '' });

            // Automatically download the file directly to the user's computer
            const downloadCleanHTML = () => {
                // We extract the code currently running and wrap it back into a clean HTML file
                const scriptTag = document.querySelector('script[type="text/babel"]');
                const scriptContent = scriptTag ? scriptTag.innerHTML : '';
                
                const cleanSourceCode = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Grading Quiz App</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin><\/script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin><\/script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    <script type="text/babel">${scriptContent}<\/script>
</body>
</html>`;

                const blob = new Blob([cleanSourceCode], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'index.html'; // Forces the correct name without .txt
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            // Timer logic
            useEffect(() => {
                let timer;
                if (quizActive && timeLeft > 0) {
                    timer = setInterval(() => setTimeLeft((prev) => prev - 1), 1000);
                } else if (timeLeft === 0) {
                    setQuizActive(false);
                }
                return () => clearInterval(timer);
            }, [quizActive, timeLeft]);

            const startQuiz = () => {
                setTimeLeft(60);
                setQuizActive(true);
                setFormData({ studentName: '', q1: '', q2: '' });
            };

            const handleInputChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!quizActive) return;

                const newSubmission = {
                    id: Date.now(),
                    timestamp: new Date().toLocaleTimeString(),
                    studentName: formData.studentName || "Anonymous",
                    q1: formData.q1,
                    q2: formData.q2
                };

                setSubmissions([newSubmission, ...submissions]);
                setFormData({ studentName: '', q1: '', q2: '' });
                alert("Assignment submitted to the teacher!");
            };

            // --- Simulated Google Sheets ARRAYFORMULA Logic ---
            const gradeQ1 = (answer) => {
                const cleanAnswer = answer.trim().toLowerCase();
                return cleanAnswer === 'paris' ? 100 : 0;
            };

            const gradeQ2 = (answer) => {
                const cleanAnswer = answer.toLowerCase();
                return cleanAnswer.includes('chlorophyll') ? 100 : 0;
            };

            return (
                <div className="min-h-screen text-slate-800 font-sans pb-12">
                    {/* Top Action Bar */}
                    <div className="bg-slate-800 text-white p-2 flex justify-end px-6">
                        <button 
                            onClick={downloadCleanHTML}
                            className="flex items-center text-sm bg-blue-500 hover:bg-blue-400 text-white px-4 py-1.5 rounded-full font-medium transition-colors"
                        >
                            <DownloadIcon className="w-4 h-4 mr-2" />
                            Download index.html for GitHub
                        </button>
                    </div>

                    {/* Navigation Bar */}
                    <nav className="bg-white shadow-sm border-b p-4 flex justify-center space-x-4 sticky top-0 z-10">
                        <button
                            onClick={() => setView('student')}
                            className={`flex items-center px-4 py-2 rounded-md transition-colors ${
                                view === 'student' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                            }`}
                        >
                            <UserIcon className="w-4 h-4 mr-2" />
                            Student View (GitHub)
                        </button>
                        <button
                            onClick={() => setView('teacher')}
                            className={`flex items-center px-4 py-2 rounded-md transition-colors ${
                                view === 'teacher' ? 'bg-green-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                            }`}
                        >
                            <TableIcon className="w-4 h-4 mr-2" />
                            Teacher View (Google Sheets)
                        </button>
                    </nav>

                    <div className="max-w-4xl mx-auto mt-8 px-4">
                        {/* STUDENT VIEW */}
                        {view === 'student' && (
                            <div className="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100">
                                <div className="bg-blue-600 text-white p-6 flex justify-between items-center">
                                    <div>
                                        <h1 className="text-2xl font-bold">Science & Geography Quiz</h1>
                                        <p className="text-blue-100 text-sm mt-1">Submit before the timer runs out!</p>
                                    </div>
                                    
                                    <div className={`flex items-center space-x-2 px-4 py-2 rounded-lg font-mono text-xl font-bold ${
                                        timeLeft <= 10 && quizActive ? 'bg-red-500 animate-pulse' : 'bg-blue-800'
                                    }`}>
                                        <ClockIcon className="w-5 h-5" />
                                        <span>00:{timeLeft.toString().padStart(2, '0')}</span>
                                    </div>
                                </div>

                                <div className="p-6 md:p-8">
                                    {!quizActive && timeLeft === 60 ? (
                                        <div className="text-center py-12">
                                            <h2 className="text-xl font-medium text-gray-700 mb-4">Ready to start the assignment?</h2>
                                            <button 
                                                onClick={startQuiz}
                                                className="flex items-center mx-auto bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-full font-medium transition-transform transform hover:scale-105"
                                            >
                                                <PlayIcon className="w-5 h-5 mr-2" />
                                                Start 60-Second Timer
                                            </button>
                                        </div>
                                    ) : (
                                        <form onSubmit={handleSubmit} className="space-y-6">
                                            <div className="space-y-2">
                                                <label className="block text-sm font-semibold text-gray-700">Full Name</label>
                                                <input
                                                    type="text"
                                                    name="studentName"
                                                    required
                                                    disabled={!quizActive}
                                                    value={formData.studentName}
                                                    onChange={handleInputChange}
                                                    className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-100"
                                                    placeholder="e.g. John Doe"
                                                />
                                            </div>

                                            <div className="space-y-2 bg-blue-50 p-5 rounded-lg border border-blue-100">
                                                <label className="block font-medium text-gray-800">
                                                    1. What is the capital of France? <span className="text-sm font-normal text-gray-500">(Auto-grades Exact Match)</span>
                                                </label>
                                                <input
                                                    type="text"
                                                    name="q1"
                                                    required
                                                    disabled={!quizActive}
                                                    value={formData.q1}
                                                    onChange={handleInputChange}
                                                    className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-100"
                                                    placeholder="Type your answer..."
                                                />
                                            </div>

                                            <div className="space-y-2 bg-green-50 p-5 rounded-lg border border-green-100">
                                                <label className="block font-medium text-gray-800">
                                                    2. Explain how plants get their green color. <span className="text-sm font-normal text-gray-500">(Auto-grades Keyword)</span>
                                                </label>
                                                <textarea
                                                    name="q2"
                                                    required
                                                    disabled={!quizActive}
                                                    value={formData.q2}
                                                    onChange={handleInputChange}
                                                    rows={3}
                                                    className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 disabled:bg-gray-100"
                                                    placeholder="Write your explanation..."
                                                />
                                            </div>

                                            <button
                                                type="submit"
                                                disabled={!quizActive}
                                                className={`w-full flex justify-center items-center py-4 rounded-lg font-bold text-lg transition-all ${
                                                    quizActive 
                                                        ? 'bg-blue-600 hover:bg-blue-700 text-white shadow-md hover:shadow-lg' 
                                                        : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                                }`}
                                            >
                                                {quizActive ? (
                                                    <>
                                                        <SendIcon className="w-5 h-5 mr-2" />
                                                        Submit Assignment
                                                    </>
                                                ) : (
                                                    'Time is up! Form Locked.'
                                                )}
                                            </button>
                                        </form>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TEACHER VIEW */}
                        {view === 'teacher' && (
                            <div className="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100">
                                <div className="bg-green-600 text-white p-6">
                                    <h1 className="text-2xl font-bold">Live Submissions Sheet</h1>
                                    <p className="text-green-100 text-sm mt-1">Simulating Google Sheets ARRAYFORMULA auto-grading.</p>
                                </div>

                                <div className="overflow-x-auto">
                                    {submissions.length === 0 ? (
                                        <div className="p-12 text-center text-gray-500">
                                            <TableIcon className="w-12 h-12 mx-auto text-gray-300 mb-4" />
                                            <p>No submissions yet.</p>
                                            <p className="text-sm">Switch to the Student View, start the timer, and submit a test answer.</p>
                                        </div>
                                    ) : (
                                        <table className="w-full text-left border-collapse min-w-[800px]">
                                            <thead>
                                                <tr className="bg-gray-100 border-b border-gray-200 text-sm font-bold text-gray-700 uppercase tracking-wider">
                                                    <th className="p-4">Time</th>
                                                    <th className="p-4">Student</th>
                                                    <th className="p-4 border-l border-gray-300">Q1 Answer</th>
                                                    <th className="p-4 text-center">Q1 Grade</th>
                                                    <th className="p-4 border-l border-gray-300">Q2 Answer</th>
                                                    <th className="p-4 text-center">Q2 Grade</th>
                                                </tr>
                                            </thead>
                                            <tbody className="text-sm divide-y divide-gray-100">
                                                {submissions.map((sub) => {
                                                    const scoreQ1 = gradeQ1(sub.q1);
                                                    const scoreQ2 = gradeQ2(sub.q2);

                                                    return (
                                                        <tr key={sub.id} className="hover:bg-gray-50 transition-colors">
                                                            <td className="p-4 text-gray-500 whitespace-nowrap">{sub.timestamp}</td>
                                                            <td className="p-4 font-semibold text-gray-800 whitespace-nowrap">{sub.studentName}</td>
                                                            
                                                            <td className="p-4 border-l border-gray-200">
                                                                <span className="bg-gray-100 px-2 py-1 rounded text-gray-700 font-mono text-xs">
                                                                    {sub.q1}
                                                                </span>
                                                            </td>
                                                            <td className="p-4 text-center">
                                                                {scoreQ1 === 100 ? (
                                                                    <span className="inline-flex items-center bg-green-100 text-green-800 px-2 py-1 rounded-full text-xs font-bold">
                                                                        <CheckCircleIcon className="w-3 h-3 mr-1" /> 100%
                                                                    </span>
                                                                ) : (
                                                                    <span className="inline-flex items-center bg-red-100 text-red-800 px-2 py-1 rounded-full text-xs font-bold">
                                                                        <XCircleIcon className="w-3 h-3 mr-1" /> 0%
                                                                    </span>
                                                                )}
                                                            </td>

                                                            <td className="p-4 border-l border-gray-200 max-w-[200px] truncate" title={sub.q2}>
                                                                <span className="text-gray-700 italic">"{sub.q2}"</span>
                                                            </td>
                                                            <td className="p-4 text-center">
                                                                {scoreQ2 === 100 ? (
                                                                    <span className="inline-flex items-center bg-green-100 text-green-800 px-2 py-1 rounded-full text-xs font-bold">
                                                                        <CheckCircleIcon className="w-3 h-3 mr-1" /> 10/10
                                                                    </span>
                                                                ) : (
                                                                    <span className="inline-flex items-center bg-red-100 text-red-800 px-2 py-1 rounded-full text-xs font-bold">
                                                                        <XCircleIcon className="w-3 h-3 mr-1" /> 0/10
                                                                    </span>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
