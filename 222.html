html,body{height:100%}
body{

      { type:"LINE", where:"party", text:"You are introducing two friends but forgot one's name. \"I'm so sorry, <span class='target'>my mind just went blank</span>. What was your name again?\"", tts:[{text:"I'm so sorry, my mind just went blank. What was your name again?"}], target:"Name", q:"'My mind went blank' means:", opts:[{t:"I suddenly forgot.", r:true},{t:"I am very smart.", r:false},{t:"My brain is white.", r:false}], fbR:"Yes! Relates back to our expressions lesson.", fbW:"It means you suddenly forgot." }

/* ============================================================
   STATE MANAGEMENT
   ============================================================ */
let activeTabIdx = 0;
// One state object per category
let tabStates = CATEGORIES.map(()=>({
  idx: 0,
  streak: 0,
  score: 0,
  answered: new Set(),
  visited: new Set(),
  answeredState: new Map(),
  stats: {} // dynamically track targets seen
}));

function getS(){ return tabStates[activeTabIdx]; }
function getM(){ return CATEGORIES[activeTabIdx].moments; }

let mode = 'read';
const stage = document.getElementById('stage');

/* UI Elements */
const btnAuto = document.getElementById('btnAuto');
const btnReplay = document.getElementById('btnReplay');
const btnSpeed = document.getElementById('btnSpeed');
const btnSettings = document.getElementById('btnSettings');
const popover = document.getElementById('popover');
const voiceSelect = document.getElementById('voiceSelect');
const flipPrev = document.getElementById('flipPrev');
const flipNext = document.getElementById('flipNext');
const tabsContainer = document.getElementById('tabsContainer');

/* ============================================================
   TTS ENGINE (Upgraded Google Prioritization)
   ============================================================ */
const TTS = {
  voices: [], selected: null, speed: 1.0, auto: true, loaded: false,

  load(){
    const list = speechSynthesis.getVoices();
    if(!list || list.length === 0) return false;
    
    // Filter to English
    const en = list.filter(v => /^en[-_]/i.test(v.lang) || v.lang.toLowerCase().startsWith('en'));
    this.voices = en.length ? en : list;
    
    // Aggressive sorting: Heavily prioritize any voice with "Google" in name or URI
    this.voices.sort((a,b)=>{
      const score = v => {
        let s = 0;
        const n = (v.name || '').toLowerCase();
        const uri = (v.voiceURI || '').toLowerCase();
        
        // Is it a Google Voice? Massive priority boost.
        if(n.includes('google') || uri.includes('google')) s += 1000;
        
        // Minor boost for standard US/UK accents to ensure clarity if multiple exist
        if(v.lang === 'en-US') s += 100;
        if(v.lang === 'en-GB') s += 90;
        
        // Fallbacks for other premium engines
        if(n.includes('neural') || n.includes('natural')) s += 50;
        if(n.includes('microsoft')) s += 30;
        if(v.default) s += 10;
        
        return s;
      };
      return score(b) - score(a);
    });
    
    // Check if current selection is already Google
    const isCurrentGoogle = this.selected && this.isGoogle(this.selected);
    
    // If we have nothing selected, OR if the current isn't Google but a Google one just loaded in, upgrade it.
    if (!this.selected || !isCurrentGoogle) {
        this.selected = this.voices[0] || null;
    }
    
    this.loaded = true;
    updateQualityDot();
    return true;
  },
  isGoogle(v){ 
    if(!v) return false;
    const n = (v.name || '').toLowerCase();
    const uri = (v.voiceURI || '').toLowerCase();
    return n.includes('google') || uri.includes('google'); 
  },
  populateSelector(selectEl){
    selectEl.innerHTML = '';
    this.voices.forEach((v,i)=>{
      const opt = document.createElement('option');
      opt.value = i;
      const n = v.name.toLowerCase();
      let prefix = '';
      if(this.isGoogle(v)) prefix = '[Google] ';
      else if(n.includes('neural') || n.includes('natural')) prefix = '[Neural] ';
      else if(n.includes('microsoft')) prefix = '[MS] ';
      opt.textContent = prefix + v.name + ' (' + v.lang + ')';
      if(v === this.selected) opt.selected = true;
      selectEl.appendChild(opt);
    });
  },
  speak(items, opts){
    speechSynthesis.cancel();
    if(!this.loaded){ if(!this.load()) return; }
    opts = opts || {};
    const onItemStart = opts.onItemStart || function(){};
    const onItemEnd = opts.onItemEnd || function(){};
    const onAllDone = opts.onAllDone || function(){};
    let i = 0;
    const playNext = () => {
      if(i >= items.length){ onAllDone(); return; }
      const item = items[i];
      const spoken = expandForTTS(item.text);
      const u = new SpeechSynthesisUtterance(spoken);
      if(this.selected) u.voice = this.selected;
      u.rate = this.speed; u.pitch = 1.0;
      u.lang = (this.selected && this.selected.lang) || 'en-US';
      u.onstart = () => onItemStart(i, item);
      u.onend = () => { onItemEnd(i, item); i++; setTimeout(playNext, 220); };
      u.onerror = () => { i++; setTimeout(playNext, 220); };
      speechSynthesis.speak(u);
    };
    playNext();
  },
  stop(){ speechSynthesis.cancel(); }
};

function updateQualityDot(){
  const isG = TTS.isGoogle(TTS.selected);
  const dot = document.getElementById('qDot');
  if(dot){
    dot.classList.remove('google','fallback');
    dot.classList.add(isG ? 'google' : 'fallback');
  }
  const legend = document.getElementById('legendDot');
  if(legend) legend.style.background = isG ? 'var(--green-bright)' : 'var(--warn)';
}

if('speechSynthesis' in window){
  TTS.load(); // Try initial load
  // Listen for voiceschanged event (this is when Google voices usually pop in on Chrome)
  speechSynthesis.onvoiceschanged = () => {
    TTS.load();
    const sel = document.getElementById('voiceSelect');
    if(sel) TTS.populateSelector(sel);
  };
}

/* ============================================================
   EVENTS & NAVIGATION
   ============================================================ */
btnAuto.addEventListener('click',()=>{
  TTS.auto = !TTS.auto;
  btnAuto.classList.toggle('on', TTS.auto);
});
btnReplay.addEventListener('click', playCurrentMoment);

const speeds = [0.8, 1.0, 1.2];
let speedIdx = 1;
btnSpeed.addEventListener('click',()=>{
  speedIdx = (speedIdx+1) % speeds.length;
  TTS.speed = speeds[speedIdx];
  btnSpeed.textContent = TTS.speed.toFixed(1)+'x';
});

btnSettings.addEventListener('click',(e)=>{
  e.stopPropagation();
  popover.classList.toggle('open');
  if(popover.classList.contains('open')){
    TTS.populateSelector(voiceSelect);
    updateQualityDot();
  }
});
document.addEventListener('click',(e)=>{
  if(!popover.contains(e.target) && e.target !== btnSettings) popover.classList.remove('open');
});
voiceSelect.addEventListener('change',()=>{
  TTS.selected = TTS.voices[parseInt(voiceSelect.value)];
  updateQualityDot();
});

document.querySelectorAll('.mode-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    mode = b.dataset.mode;
    render();
  });
});

function goPrev(){
  if(getS().idx > 0){ getS().idx--; render(); }
}
function goNext(){
  if(getS().idx < getM().length){ getS().idx++; render(); }
}
flipPrev.addEventListener('click', goPrev);
flipNext.addEventListener('click', goNext);

document.addEventListener('keydown',(e)=>{
  if(e.key === 'ArrowLeft') goPrev();
  else if(e.key === 'ArrowRight') goNext();
});

let touchStartX = 0, touchStartY = 0;
document.getElementById('stage').addEventListener('touchstart',(e)=>{
  if(e.touches.length === 1){
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
},{passive:true});
document.getElementById('stage').addEventListener('touchend',(e)=>{
  if(e.changedTouches.length !== 1) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.5){
    if(dx > 0) goPrev();
    else goNext();
  }
},{passive:true});

function setSpeaking(on){
  btnReplay.classList.toggle('speaking', on);
  const bigBtn = document.querySelector('.big-replay');
  if(bigBtn) bigBtn.classList.toggle('speaking', on);
}

function highlightItem(itemIdx, on){
  const bubbles = stage.querySelectorAll('.bubble');
  const narration = stage.querySelector('.narration');
  if(bubbles.length > 0){
    bubbles.forEach(b => b.classList.remove('now-playing'));
    if(on && bubbles[itemIdx]) bubbles[itemIdx].classList.add('now-playing');
  } else if(narration){
    narration.classList.toggle('now-playing', on);
  }
}

function playCurrentMoment(){
  const moments = getM();
  const m = moments[getS().idx];
  if(!m || !m.tts) return;
  setSpeaking(true);
  TTS.speak(m.tts, {
    onItemStart:(i)=>highlightItem(i,true),
    onItemEnd:(i)=>highlightItem(i,false),
    onAllDone:()=>setSpeaking(false)
  });
}

function switchTab(index) {
  activeTabIdx = index;
  renderTabs();
  render();
}
window.switchTab = switchTab; // expose for inline onclick

function renderTabs() {
  tabsContainer.innerHTML = '';
  CATEGORIES.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = `tab-btn ${i === activeTabIdx ? 'active' : ''}`;
    btn.textContent = c.title;
    btn.onclick = () => switchTab(i);
    tabsContainer.appendChild(btn);
  });
  // auto scroll active tab into view softly
  const activeBtn = tabsContainer.querySelector('.active');
  if(activeBtn){
    activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  TTS.stop();
  setSpeaking(false);

  const S = getS();
  const M = getM();
  const total = M.length;
  
  document.getElementById('progressFill').style.width = (S.answered.size/total*100)+'%';
  document.getElementById('streakBox').textContent = S.streak;

  flipPrev.disabled = S.idx <= 0;
  flipNext.disabled = S.idx >= total;

  if(S.idx >= total){ renderFinal(); return; }

  const m = M[S.idx];
  
  // Track encounters dynamically
  if(!S.visited.has(S.idx)){
    S.stats[m.target] = (S.stats[m.target] || 0) + 1;
    if(m.bonus) S.stats[m.bonus] = (S.stats[m.bonus] || 0) + 1;
    S.visited.add(S.idx);
  }

  const enc = S.stats[m.target] || 1;
  const againBadge = enc >= 2 ? `<span class="again">again #${enc}</span>` : '';

  let body = '';
  if(mode === 'listen'){
    body = `
      <div class="listen-pad">
        <div class="ear">listen</div>
        <p>Close your eyes. Tap to play again.</p>
        <button class="big-replay" id="bigReplay">&#9654; Play</button>
      </div>
    `;
  } else {
    if(m.type === 'LINE' || m.type === 'YOU'){
      body = `<div class="narration">${m.text}</div>`;
    } else if(m.type === 'CHAT'){
      body = m.lines.map(l=>{
        const sc = l.side==='right' ? 'right' : '';
        return `<div class="who ${sc}">${l.who}</div><div class="bubble ${sc}">${l.t}</div>`;
      }).join('');
    }
  }

  const fullClass = m.type === 'YOU' ? 'full' : '';
  const optsHTML = m.opts.map((o,oi)=>
    `<button class="option" data-r="${o.r?1:0}" data-i="${oi}">${o.t}</button>`
  ).join('');

  let revealHTML = '';
  if(mode === 'listen'){
    let revealText = '';
    if(m.type === 'LINE' || m.type === 'YOU') revealText = m.text;
    else if(m.type === 'CHAT') revealText = m.lines.map(l=>`<b>${l.who}:</b> ${l.t}`).join('<br>');
    revealHTML = `<div class="reveal" id="reveal">${revealText}</div>`;
  }

  // Inject download button only if Tab 1 (idx 0) and Slide 1 (idx 0)
  let downloadBtnHTML = '';
  if (activeTabIdx === 0 && S.idx === 0) {
    downloadBtnHTML = `
      <button class="download-btn" id="btnDownloadApp">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Download App to Play Offline
      </button>
    `;
  }

  stage.innerHTML = `
    <div class="moment">
      <div class="tag">
        <span class="where">${m.where}</span>
        <div class="meta">
          <span class="scene-num">${S.idx+1} / ${total}</span>
          ${againBadge}
        </div>
      </div>
      <div class="body">
        ${body}
        <div class="q">${m.q}</div>
        <div class="options ${fullClass}">${optsHTML}</div>
        <div class="fb" id="fb"></div>
        ${revealHTML}
        ${downloadBtnHTML}
      </div>
    </div>
  `;

  stage.querySelectorAll('.option').forEach(btn=>{
    btn.addEventListener('click',()=>handleAnswer(btn,m));
  });

  // Restore answered state
  if(S.answeredState.has(S.idx)){
    const st = S.answeredState.get(S.idx);
    const all = stage.querySelectorAll('.option');
    all.forEach(o=>o.classList.add('locked'));
    if(st.chosen != null){
      const chosenBtn = stage.querySelector(`.option[data-i="${st.chosen}"]`);
      if(chosenBtn) chosenBtn.classList.add(st.right ? 'right' : 'wrong');
      if(!st.right){
        all.forEach(o=>{ if(o.dataset.r==='1') o.classList.add('right'); });
      }
    }
    const fb = document.getElementById('fb');
    fb.textContent = st.right ? m.fbR : m.fbW;
    fb.classList.add('show', st.right ? 'right' : 'wrong');
    const reveal = document.getElementById('reveal');
    if(reveal) reveal.classList.add('show');
  }

  const bigReplay = document.getElementById('bigReplay');
  if(bigReplay) bigReplay.addEventListener('click', playCurrentMoment);

  const btnDownloadApp = document.getElementById('btnDownloadApp');
  if(btnDownloadApp) {
    btnDownloadApp.addEventListener('click', (e) => {
      e.stopPropagation();
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "Snap_English.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }

  updateQualityDot();

  if(TTS.auto){
    setTimeout(playCurrentMoment, 350);
  }
}

function handleAnswer(btn, m){
  const S = getS();
  if(S.answeredState.has(S.idx)) return;

  const all = stage.querySelectorAll('.option');
  all.forEach(o=>o.classList.add('locked'));
  const right = btn.dataset.r === '1';
  const fb = document.getElementById('fb');
  
  if(right){
    btn.classList.add('right');
    S.streak++; S.score++;
    fb.textContent = m.fbR;
    fb.classList.add('show','right');
  } else {
    btn.classList.add('wrong');
    S.streak = 0;
    all.forEach(o=>{ if(o.dataset.r==='1') o.classList.add('right'); });
    fb.textContent = m.fbW;
    fb.classList.add('show','wrong');
  }
  
  S.answered.add(S.idx);
  S.answeredState.set(S.idx, { right: right, chosen: parseInt(btn.dataset.i) });

  document.getElementById('streakBox').textContent = S.streak;
  document.getElementById('progressFill').style.width = (S.answered.size/getM().length*100)+'%';

  const reveal = document.getElementById('reveal');
  if(reveal) reveal.classList.add('show');
}

function renderFinal(){
  TTS.stop();
  setSpeaking(false);
  document.getElementById('progressFill').style.width = '100%';
  flipPrev.disabled = false;
  flipNext.disabled = true;
  
  const S = getS();
  const total = getM().length;
  let list = '';
  Object.entries(S.stats).forEach(([k,v])=>{
    if(v>0) list += `<div class="met-item"><span class="name">${k}</span><span class="count">${v}x</span></div>`;
  });
  
  let actionBtn = '';
  if(activeTabIdx < CATEGORIES.length - 1){
    actionBtn = `<button class="btn-restart" onclick="switchTab(${activeTabIdx + 1})">Next Category &rarr;</button>`;
  } else {
    actionBtn = `<button class="btn-restart" onclick="location.reload()">Start Over</button>`;
  }

  stage.innerHTML = `
    <div class="final">
      <div class="final-score">${S.score}/${total}</div>
      <h2>Category Done!</h2>
      <p>You met these in real moments.</p>
      <div class="met">${list}</div>
      ${actionBtn}
    </div>
  `;
}

// Init
renderTabs();
render();
</script>
